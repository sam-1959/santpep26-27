name: Envia resum RPE JBF

on:
  schedule:
    # 10:17 Europe/Madrid en horari d'estiu. GitHub Actions fa servir UTC.
    - cron: "17 8 * * *"
  workflow_dispatch:

jobs:
  send-rpe-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Envia correu RPE JBF
        env:
          RPE_TEAM_KEY: JBF
          RPE_RECIPIENT: ricard.fuste@gmail.com
          RPE_EMAIL_APP_SCRIPT_URL: https://script.google.com/macros/s/AKfycbxDAD6TMxQh_fb5hRuv8o2NA1bdZaknBoEsICDz1fGX75DqdOu_PKrorXZ4Bu3TuSzBuA/exec
        run: node scripts/send-rpe-weekly-email.js
