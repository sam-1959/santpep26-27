name: Envia resum setmanal Visites Fisio

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validar sense enviar correus"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      force:
        description: "Forçar encara que la setmana ja consti enviada"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      recipient_override:
        description: "Destinatari de prova"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: physio-visits-weekly-email
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Envia resum setmanal de Visites Fisio
        env:
          PHYSIO_VISITS_WEEK_OFFSET_DAYS: 7
          PHYSIO_VISITS_EMAIL_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          PHYSIO_VISITS_EMAIL_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}
          PHYSIO_VISITS_EMAIL_RECIPIENT_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.recipient_override || 'dtecnic@cbsantjosep.cat' }}
          PHYSIO_VISITS_EMAIL_RECIPIENT_NAMES_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.recipient_override || 'Direcció tècnica' }}
          PHYSIO_VISITS_EMAIL_RECIPIENTS: ""
          PHYSIO_VISITS_EMAIL_RECIPIENT_NAMES: ""
          PHYSIO_VISITS_EMAIL_APP_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbzScJtQ9R5NMFw2ZAUAnZyWq52OL6Ds1waJ_4XYRTzL36x354opt6Kdh1IojkmdordO/exec"
        run: |
          for intent in 1 2 3; do
            echo "Intent ${intent}/3 d'enviament del resum setmanal de Visites Fisio..."
            if node scripts/send-physio-visits-weekly-email.js; then
              echo "Enviament completat a l'intent ${intent}."
              exit 0
            fi
            if [ "${intent}" -lt 3 ]; then
              echo "Intent ${intent} fallit. Es torna a provar en 60 segons."
              sleep 60
            fi
          done
          echo "No s'ha pogut completar l'enviament després de 3 intents."
          exit 1

      - name: Desa estat del correu de Visites Fisio
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true') }}
        run: |
          if git diff --quiet -- data/physio-visits-email-status.json && [ -z "$(git ls-files --others --exclude-standard data/physio-visits-email-status.json)" ]; then
            echo "Sense canvis a l'estat del correu de Visites Fisio."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/physio-visits-email-status.json
            git commit -m "Actualitza estat correu Visites Fisio"
            git pull --rebase
            git push
          fi
