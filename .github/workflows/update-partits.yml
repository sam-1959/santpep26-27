name: Actualitza partits

# Baixa els calendaris de partits (masculí i femení), regenera les dades
# incrustades a partits.html, fa commit a main si hi ha canvis i, tot seguit,
# desplega a GitHub Pages dins el mateix run.
#
# Per què desplega aquí mateix: un commit fet pel github-actions[bot] amb el
# GITHUB_TOKEN NO dispara altres workflows (limitació de GitHub), així que el
# workflow de desplegament (pages.yml) no s'activaria per aquest commit. Per
# tenir l'actualització 100% automàtica, publiquem des d'aquest mateix job.

on:
  schedule:
    # Cada hora. GitHub cron és sempre UTC.
    - cron: "30 * * * *"
    # Dilluns 09:17 Europe/Madrid en horari d'estiu.
    # Envia el resum de Visites Fisio de la setmana anterior.
    - cron: "17 7 * * 1"
  workflow_dispatch:
    inputs:
      test_whatsapp:
        description: "Envia un WhatsApp de prova al destinatari de test"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      send_physio_visits:
        description: "Envia ara el correu setmanal de Visites Fisio"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      physio_visits_dry_run:
        description: "Valida Visites Fisio sense enviar correus"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      physio_visits_recipient_override:
        description: "Destinatari de prova Visites Fisio (opcional)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

# Comparteix grup amb pages.yml perquè els desplegaments se serialitzin.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '30 * * * *') || (github.event_name == 'workflow_dispatch' && github.event.inputs.send_physio_visits != 'true') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Actualitza les dades de partits
        run: node scripts/update-partits.js

      - name: Avisa canvis per WhatsApp
        if: ${{ !cancelled() }}
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          WHATSAPP_RECIPIENTS: ${{ secrets.WHATSAPP_RECIPIENTS }}
          WHATSAPP_TEST_RECIPIENT: ${{ secrets.WHATSAPP_TEST_RECIPIENT }}
          WHATSAPP_FORCE_TEST: ${{ github.event.inputs.test_whatsapp }}
        run: node scripts/notify-partits-whatsapp.js

      - name: Commit si hi ha canvis
        run: |
          if git diff --quiet -- partits.html; then
            echo "Sense canvis als partits."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add partits.html
            git commit -m "Actualitza partits des dels calendaris (masc + fem)"
            git push
          fi

      # --- Desplegament a Pages (des dels fitxers ja actualitzats) ---
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      # El backend de Pages retorna sovint "Deployment failed, try again
      # later." al primer intent (error transitori, no del build). Reintentem
      # automàticament fins a 3 cops perquè no calgui re-desplegar a mà.
      - id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - if: steps.deploy1.outcome == 'failure'
        run: sleep 15

      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 30

      # Tercer intent: aquest SÍ fa fallar el job si també falla.
      - id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v5

  send-physio-visits-email:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '17 7 * * 1') || (github.event_name == 'workflow_dispatch' && github.event.inputs.send_physio_visits == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Envia correu setmanal de Visites Fisio
        env:
          PHYSIO_VISITS_WEEK_OFFSET_DAYS: 7
          PHYSIO_VISITS_EMAIL_DRY_RUN: ${{ github.event.inputs.physio_visits_dry_run }}
          PHYSIO_VISITS_EMAIL_RECIPIENT_OVERRIDE: ${{ github.event.inputs.physio_visits_recipient_override }}
          PHYSIO_VISITS_EMAIL_RECIPIENT_NAMES_OVERRIDE: ${{ github.event.inputs.physio_visits_recipient_override }}
          PHYSIO_VISITS_EMAIL_RECIPIENTS: ${{ secrets.PHYSIO_VISITS_EMAIL_RECIPIENTS || 'ricard.fuste@gmail.com' }}
          PHYSIO_VISITS_EMAIL_RECIPIENT_NAMES: ${{ secrets.PHYSIO_VISITS_EMAIL_RECIPIENT_NAMES || 'Ricard Fusté' }}
          PHYSIO_VISITS_EMAIL_APP_SCRIPT_URL: ${{ secrets.PHYSIO_VISITS_EMAIL_APP_SCRIPT_URL || 'https://script.google.com/macros/s/AKfycbxpF6Jym7L_lPwBTX1W8ozSEx3h9ytdQrSUOC3tywVvPLkJdgQnpUhVJrokDcucNo3G/exec' }}
        run: node scripts/send-physio-visits-weekly-email.js

      - name: Desa estat del correu de Visites Fisio
        if: ${{ always() && github.event.inputs.physio_visits_dry_run != 'true' }}
        run: |
          if git diff --quiet -- data/physio-visits-email-status.json; then
            echo "Sense canvis a l'estat del correu de Visites Fisio."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/physio-visits-email-status.json
            git commit -m "Actualitza estat correu Visites Fisio"
            git pull --rebase
            git push
          fi
