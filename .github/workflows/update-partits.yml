name: Actualitza partits

# Baixa els calendaris de partits (masculí i femení), regenera les dades
# incrustades a partits.html, fa commit a main si hi ha canvis i, tot seguit,
# desplega a GitHub Pages dins el mateix run.
#
# Per què desplega aquí mateix: un commit fet pel github-actions[bot] amb el
# GITHUB_TOKEN NO dispara altres workflows (limitació de GitHub), així que el
# workflow de desplegament (pages.yml) no s'activaria per aquest commit. Per
# tenir l'actualització 100% automàtica, publiquem des d'aquest mateix job.

on:
  schedule:
    # Cada hora. GitHub cron és sempre UTC.
    - cron: "30 * * * *"
    # 10:17 Europe/Madrid en horari d'estiu. GitHub cron és sempre UTC.
    - cron: "17 8 * * *"
    # Reintents diaris del correu RPE per millorar fiabilitat sense duplicats.
    - cron: "47 8 * * *"
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      test_whatsapp:
        description: "Envia un WhatsApp de prova al destinatari de test"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write
  pages: write
  id-token: write

# Comparteix grup amb pages.yml perquè els desplegaments se serialitzin.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    if: ${{ github.event_name != 'schedule' || github.event.schedule == '30 * * * *' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Actualitza les dades de partits
        run: node scripts/update-partits.js

      - name: Avisa canvis per WhatsApp
        if: ${{ !cancelled() }}
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          WHATSAPP_RECIPIENTS: ${{ secrets.WHATSAPP_RECIPIENTS }}
          WHATSAPP_TEST_RECIPIENT: ${{ secrets.WHATSAPP_TEST_RECIPIENT }}
          WHATSAPP_FORCE_TEST: ${{ github.event.inputs.test_whatsapp }}
        run: node scripts/notify-partits-whatsapp.js

      - name: Commit si hi ha canvis
        run: |
          if git diff --quiet -- partits.html; then
            echo "Sense canvis als partits."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add partits.html
            git commit -m "Actualitza partits des dels calendaris (masc + fem)"
            git push
          fi

      # --- Desplegament a Pages (des dels fitxers ja actualitzats) ---
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      # El backend de Pages retorna sovint "Deployment failed, try again
      # later." al primer intent (error transitori, no del build). Reintentem
      # automàticament fins a 3 cops perquè no calgui re-desplegar a mà.
      - id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - if: steps.deploy1.outcome == 'failure'
        run: sleep 15

      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 30

      # Tercer intent: aquest SÍ fa fallar el job si també falla.
      - id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v5

  send-rpe-email:
    if: ${{ github.event_name == 'schedule' && (github.event.schedule == '17 8 * * *' || github.event.schedule == '47 8 * * *' || github.event.schedule == '17 9 * * *') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Envia correu RPE JBF
        env:
          RPE_TEAM_KEY: JBF
          RPE_EMAIL_APP_SCRIPT_URL: https://script.google.com/macros/s/AKfycbxDAD6TMxQh_fb5hRuv8o2NA1bdZaknBoEsICDz1fGX75DqdOu_PKrorXZ4Bu3TuSzBuA/exec
        run: node scripts/send-rpe-weekly-email.js

      - name: Desa estat del correu RPE
        if: ${{ always() }}
        run: |
          if git diff --quiet -- data/rpe-email-status.json; then
            echo "Sense canvis a l'estat del correu RPE."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/rpe-email-status.json
            git commit -m "Actualitza estat correu RPE"
            git push
          fi
