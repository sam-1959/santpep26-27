<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>Roba coachs Pentex · CB Sant Josep</title>
  <style>
    :root {
      --brand:#713f97; --brand-dark:#5a2f7d; --accent:#fcdb20;
      --bg:#f5f3f8; --card:#ffffff; --ink:#2a2233; --muted:#7a7085;
      --line:#e6e0ee; --shadow:0 1px 3px rgba(60,40,90,0.08),0 4px 16px rgba(60,40,90,0.06); --radius:14px;
      --ok:#0f766e; --empty:#c7bfce;
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); min-height:100vh;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      line-height:1.45; -webkit-font-smoothing:antialiased; }
    header { display:flex; align-items:center; gap:14px; padding:16px 20px;
      background:var(--brand); color:#fff; box-shadow:var(--shadow); }
    .club-logo { width:48px; height:48px; object-fit:contain; flex-shrink:0;
      background:#fff; border-radius:10px; padding:3px; }
    .logo-mark { display:inline-grid; place-items:center; width:40px; height:40px; flex-shrink:0; background:#fff; color:var(--brand); border-radius:9px; font-size:1.35rem; font-weight:900; }
    .logo-link { display:inline-flex; cursor:pointer; text-decoration:none; }
    .htext h1 { margin:0; font-size:1.05rem; font-weight:700; }
    .htext h1 .club { display:block; font-size:0.72rem; font-weight:500; opacity:0.85;
      letter-spacing:0.04em; text-transform:uppercase; }
    .htext p { margin:2px 0 0; font-size:0.8rem; opacity:0.9; }
    main { max-width:1120px; margin:0 auto; padding:22px 14px 60px; }
    .toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:0 0 14px; }
    .search { flex:1 1 240px; min-width:0; border:1px solid var(--line); border-radius:8px;
      padding:10px 12px; font:inherit; background:#fff; color:var(--ink); }
    .tabs { display:flex; flex-wrap:wrap; gap:8px; }
    .tab { border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:999px;
      padding:8px 12px; font-weight:700; font-size:0.82rem; cursor:pointer; }
    .tab.active { background:var(--brand); color:#fff; border-color:var(--brand); }
    .status { margin:16px 0; color:var(--muted); font-size:0.9rem; }
    .notes { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 16px; }
    .note { background:#fff8c7; border:1px solid #ead46d; color:#594800;
      border-radius:8px; padding:7px 10px; font-size:0.82rem; font-weight:650; }
    .summary { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; margin:0 0 18px; }
    .summary-card { background:var(--card); border:1px solid var(--line); border-radius:10px;
      box-shadow:var(--shadow); padding:12px; }
    .summary-title { display:flex; align-items:center; justify-content:space-between; gap:10px;
      margin:0 0 8px; font-size:0.9rem; color:var(--brand-dark); font-weight:800; }
    .summary-total { font-size:0.8rem; color:var(--muted); font-weight:700; }
    .sizes { display:flex; flex-wrap:wrap; gap:6px; }
    .size { display:inline-flex; align-items:center; gap:5px; background:#f7f3fb;
      border:1px solid var(--line); border-radius:999px; padding:5px 8px; font:inherit;
      font-size:0.8rem; font-weight:700; color:var(--ink); cursor:pointer; }
    .size.active { background:var(--brand); color:#fff; border-color:var(--brand); }
    .size b { color:var(--brand-dark); }
    .size.active b { color:#fff; }
    .table-wrap { background:var(--card); border:1px solid var(--line); border-radius:12px;
      box-shadow:var(--shadow); overflow:auto; }
    table { width:100%; border-collapse:collapse; min-width:760px; }
    th, td { padding:10px 12px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle; }
    th { position:sticky; top:0; background:#fbf9fd; color:var(--brand-dark); font-size:0.78rem;
      text-transform:uppercase; letter-spacing:0.03em; z-index:1; }
    td { font-size:0.9rem; }
    tr:last-child td { border-bottom:0; }
    .name { font-weight:750; }
    .team { display:inline-flex; align-items:center; justify-content:center; min-width:48px;
      border-radius:999px; padding:4px 8px; background:#f0e9f7; color:var(--brand-dark); font-weight:800; font-size:0.8rem; }
    .piece { display:inline-flex; min-width:38px; justify-content:center; border-radius:7px;
      padding:4px 7px; background:#ecfdf5; color:var(--ok); border:1px solid #b7ebd6; font-weight:800; }
    .missing { color:var(--empty); font-weight:700; }
    .empty { padding:32px 16px; text-align:center; color:var(--muted); }
    footer { text-align:center; color:var(--muted); font-size:0.75rem; padding:20px; }
    @media (max-width:640px) {
      main { padding:16px 10px 48px; }
      .toolbar { align-items:stretch; }
      .tabs { width:100%; }
      .tab { flex:1 1 auto; }
    }
      .page-nav { margin:0 0 16px; }
    .back { color:var(--brand); font-weight:800; text-decoration:none; font-size:0.86rem; }
  </style>
</head>
<body>
  <header>
    <a class="logo-link" href="index.html" title="Tornar a l'inici"><img class="club-logo" src="assets/santpep-logo.png" alt="Escut CB Sant Josep de Badalona" /></a>
    <span class="logo-mark" aria-hidden="true">👕</span>
    <div class="htext">
      <h1><span class="club">CB Sant Josep de Badalona</span> Roba coachs Pentex</h1>
      <p>Talles i comanda per equip</p>
    </div>
  </header>
  <main>
    <nav class="page-nav"><a class="back" href="index.html">← Tornar</a></nav>
    <div class="toolbar">
      <input class="search" id="search" type="search" placeholder="Cerca coach o equip" autocomplete="off" />
      <div class="tabs" id="teams"></div>
    </div>
    <div id="notes" class="notes"></div>
    <div id="status" class="status">Carregant dades...</div>
    <section id="summary" class="summary"></section>
    <section class="table-wrap" id="tableWrap"></section>
  </main>
  <footer>Dades: Google Sheet de roba Pentex · CB Sant Josep de Badalona</footer>

  <script>
    const SHEET_ID = "1tls9XYHTJ9Ru_Ex25eHgE-PsiWIrj68nr8QYOj99W5I";
    const SHEET_BASE = "https://docs.google.com/spreadsheets/d/" + SHEET_ID;
    const SHEET_URL = "https://docs.google.com/spreadsheets/d/" + SHEET_ID +
      "/gviz/tq?tqx=out:json;responseHandler:loadCoachSheet";
    const TITLES_URL = SHEET_BASE +
      "/gviz/tq?tqx=out:json;responseHandler:loadTitleSheet&sheet=T%C3%ADtols";
    const state = {
      rows: [],
      notes: [],
      team: "Tots",
      query: "",
      sizeFilter: null,
      hasTitle: false,
      titleMap: {},
      titleRows: []
    };
    const els = {
      status: document.getElementById("status"),
      notes: document.getElementById("notes"),
      summary: document.getElementById("summary"),
      table: document.getElementById("tableWrap"),
      teams: document.getElementById("teams"),
      search: document.getElementById("search")
    };

    function val(cell){ return cell && cell.v != null ? String(cell.v).trim() : ""; }
    function clean(s){ return String(s || "").replace(/\s+/g, " ").trim(); }
    function key(s){ return clean(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }
    function esc(s){
      return clean(s).replace(/[&<>"']/g, c => ({
        "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
      }[c]));
    }
    function titleCaseName(s){
      return clean(s).toLocaleLowerCase("ca").replace(/(^|[\s'-])(\p{L})/gu,
        (_, sep, letter) => sep + letter.toLocaleUpperCase("ca"));
    }
    function findHeader(headers, names){
      const wanted = names.map(key);
      return headers.findIndex(h => wanted.includes(key(h)));
    }
    function personKeys(name, surname){
      const firstName = key(name).split(" ").filter(Boolean)[0] || "";
      const surnameKey = key(surname);
      const firstSurname = surnameKey.split(" ").filter(Boolean)[0] || "";
      return [...new Set([
        key([name, surname].join(" ")),
        [firstName, firstSurname].filter(Boolean).join(" "),
        firstName && firstSurname ? firstName[0] + "|" + firstSurname : ""
      ])].filter(Boolean);
    }
    function setTitle(map, k, title){
      if(!k || !title) return;
      if(!map[k]) map[k] = title;
      else if(map[k] !== title) map[k] = "";
    }
    function oneEditApart(a, b){
      if(!a || !b || Math.abs(a.length - b.length) > 1) return false;
      let i = 0, j = 0, edits = 0;
      while(i < a.length && j < b.length){
        if(a[i] === b[j]) { i++; j++; continue; }
        edits++;
        if(edits > 1) return false;
        if(a.length > b.length) i++;
        else if(a.length < b.length) j++;
        else { i++; j++; }
      }
      return edits + (i < a.length ? 1 : 0) + (j < b.length ? 1 : 0) <= 1;
    }
    function lookupTitle(name, surname){
      const direct = personKeys(name, surname).map(k => state.titleMap[k]).find(Boolean);
      if(direct) return direct;
      const firstName = key(name).split(" ").filter(Boolean)[0] || "";
      const firstSurname = key(surname).split(" ").filter(Boolean)[0] || "";
      const fuzzy = state.titleRows.find(r => r.firstInitial === firstName[0] &&
        oneEditApart(r.firstSurname, firstSurname));
      return fuzzy ? fuzzy.title : "";
    }
    function parseTitles(table){
      const raw = table.rows.map(r => (r.c || []).map(val));
      const headers = raw[0] || [];
      const nameIdx = findHeader(headers, ["Nom"]);
      const surnameIdx = findHeader(headers, ["Cognoms", "Cognom"]);
      const titleIdx = findHeader(headers, [
        "Tipus Titulació",
        "Tipus Titulacio",
        "Títol",
        "Titol",
        "Titulació",
        "Titulacio"
      ]);
      const out = {};
      const titleRows = [];
      raw.slice(1).forEach(row => {
        const name = clean(row[nameIdx >= 0 ? nameIdx : 0]);
        const surname = clean(row[surnameIdx >= 0 ? surnameIdx : 1]);
        const title = clean(row[titleIdx >= 0 ? titleIdx : 2]);
        if(!name || !surname || !title) return;
        personKeys(name, surname).forEach(k => setTitle(out, k, title));
        titleRows.push({
          title,
          firstInitial: (key(name).split(" ").filter(Boolean)[0] || "")[0] || "",
          firstSurname: key(surname).split(" ").filter(Boolean)[0] || ""
        });
      });
      state.titleMap = out;
      state.titleRows = titleRows;
    }
    function applyTitles(){
      state.rows = state.rows.map(r => ({
        ...r,
        title: r.title || lookupTitle(r.name, r.surname)
      }));
    }
    function piece(value){
      return value ? '<span class="piece">' + esc(value) + '</span>' : '<span class="missing">-</span>';
    }
    function parseRows(table){
      const raw = table.rows.map(r => (r.c || []).map(val));
      const headers = raw[0] || [];
      const titleIdx = findHeader(headers, [
        "Títol",
        "Titol",
        "Títol entrenador",
        "Titol entrenador",
        "Titulació",
        "Titulacio",
        "Titulació entrenador",
        "Titulacio entrenador"
      ]);
      state.hasTitle = titleIdx >= 0;
      state.notes = [...new Set(raw.flatMap(row => row.slice(6).map(clean)).filter(Boolean))];
      return raw.slice(1).map(row => ({
        name: clean(row[0]),
        surname: clean(row[1]),
        team: clean(row[2]),
        polo: clean(row[3]),
        hoodie: clean(row[4]),
        pants: clean(row[5]),
        title: titleIdx >= 0 ? clean(row[titleIdx]) : ""
      })).filter(r => r.name || r.surname || r.team);
    }
    function filteredRows(){
      const q = key(state.query);
      return state.rows.filter(r => {
        const okTeam = state.team === "Tots" || r.team === state.team;
        const okQuery = !q || key([r.name, r.surname, r.team, r.title].join(" ")).includes(q);
        const okSize = !state.sizeFilter || r[state.sizeFilter.field] === state.sizeFilter.size;
        return okTeam && okQuery && okSize;
      }).sort(compareCoachRows);
    }
    function compareCoachRows(a, b){
      const titleA = a.title || "zzz";
      const titleB = b.title || "zzz";
      return a.team.localeCompare(b.team, "ca", { numeric: true }) ||
        titleA.localeCompare(titleB, "ca", { numeric: true }) ||
        titleCaseName(a.name + " " + a.surname).localeCompare(
          titleCaseName(b.name + " " + b.surname), "ca", { numeric: true }
        );
    }
    function baseRows(){
      const sizeFilter = state.sizeFilter;
      state.sizeFilter = null;
      const rows = filteredRows();
      state.sizeFilter = sizeFilter;
      return rows;
    }
    function renderTeams(){
      const teams = ["Tots", ...[...new Set(state.rows.map(r => r.team).filter(Boolean))].sort()];
      els.teams.innerHTML = teams.map(t =>
        '<button class="tab' + (state.team === t ? " active" : "") +
        '" type="button" data-team="' + esc(t) + '">' + esc(t) + '</button>'
      ).join("");
      els.teams.querySelectorAll("button").forEach(b => {
        b.onclick = () => { state.team = b.dataset.team; render(); };
      });
    }
    function sizeRank(size){
      const order = ["6XL", "5XL", "4XL", "3XL", "2XL", "XXL", "XL", "L", "M", "S", "XS", "2XS", "XXS"];
      const idx = order.indexOf(key(size).toUpperCase());
      return idx >= 0 ? idx : order.length;
    }
    function compareSizes(a, b){
      const rank = sizeRank(a[0]) - sizeRank(b[0]);
      return rank || a[0].localeCompare(b[0], "ca", { numeric: true });
    }
    function counts(rows, field){
      const out = {};
      rows.forEach(r => { if(r[field]) out[r[field]] = (out[r[field]] || 0) + 1; });
      return Object.entries(out).sort(compareSizes);
    }
    function renderSummary(rows){
      const items = [
        ["Polo negre", "polo"],
        ["Desuadora negra", "hoodie"],
        ["Pantaló llarg xandall", "pants"]
      ];
      els.summary.innerHTML = items.map(([label, field]) => {
        const cs = counts(rows, field);
        const total = cs.reduce((sum, x) => sum + x[1], 0);
        return '<article class="summary-card"><h2 class="summary-title">' + label +
          '<span class="summary-total">' + total + '</span></h2><div class="sizes">' +
          (cs.length ? cs.map(([size, n]) => {
            const active = state.sizeFilter && state.sizeFilter.field === field && state.sizeFilter.size === size;
            return '<button class="size' + (active ? " active" : "") + '" type="button" data-field="' +
              esc(field) + '" data-size="' + esc(size) + '" title="Filtra per ' + esc(label) + ' ' +
              esc(size) + '"><b>' + esc(size) + '</b>' + n + '</button>';
          }).join("") : '<span class="missing">Sense talles</span>') +
          '</div></article>';
      }).join("");
      els.summary.querySelectorAll(".size").forEach(b => {
        b.onclick = () => {
          const next = { field: b.dataset.field, size: b.dataset.size };
          const active = state.sizeFilter && state.sizeFilter.field === next.field &&
            state.sizeFilter.size === next.size;
          state.sizeFilter = active ? null : next;
          render();
        };
      });
    }
    function renderTable(rows){
      if(!rows.length){
        els.table.innerHTML = '<div class="empty">Cap coach amb aquests filtres.</div>';
        return;
      }
      const titleHead = "<th>Títol</th>";
      const titleCell = r => "<td>" + (esc(r.title) || '<span class="missing">-</span>') + "</td>";
      els.table.innerHTML = '<table><thead><tr><th>Coach</th><th>Equip</th>' + titleHead +
        '<th>Polo</th><th>Desuadora</th><th>Pantaló</th></tr></thead><tbody>' +
        rows.map(r => '<tr><td class="name">' + esc(titleCaseName(r.name + " " + r.surname)) + '</td>' +
          '<td><span class="team">' + esc(r.team) + '</span></td>' +
          titleCell(r) + '<td>' + piece(r.polo) + '</td><td>' + piece(r.hoodie) +
          '</td><td>' + piece(r.pants) + '</td></tr>').join("") +
        '</tbody></table>';
    }
    function renderNotes(){
      els.notes.innerHTML = state.notes.map(n => '<span class="note">' + esc(n) + '</span>').join("");
    }
    function render(){
      const rows = filteredRows();
      const summaryRows = baseRows();
      renderTeams();
      renderNotes();
      renderSummary(summaryRows);
      renderTable(rows);
      const suffix = state.sizeFilter ? " · " + state.sizeFilter.size : "";
      els.status.textContent = rows.length + " coachs" + suffix;
    }
    function fail(){
      els.status.textContent = "No s'han pogut carregar les dades del Google Sheet.";
      els.table.innerHTML = '<div class="empty">Revisa que el full sigui accessible amb l\'enllaç públic.</div>';
    }
    window.loadCoachSheet = function(payload){
      if(!payload || payload.status !== "ok" || !payload.table) return fail();
      state.rows = parseRows(payload.table);
      applyTitles();
      render();
    };
    window.loadTitleSheet = function(payload){
      if(!payload || payload.status !== "ok" || !payload.table) return;
      parseTitles(payload.table);
      applyTitles();
      if(state.rows.length) render();
    };
    els.search.addEventListener("input", () => {
      state.query = els.search.value;
      render();
    });
    const script = document.createElement("script");
    script.src = SHEET_URL + "&cache=" + Date.now();
    script.onerror = fail;
    document.head.appendChild(script);
    const titleScript = document.createElement("script");
    titleScript.src = TITLES_URL + "&cache=" + Date.now();
    document.head.appendChild(titleScript);
  </script>
</body>
</html>
