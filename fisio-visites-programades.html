<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <title>Visites de fisio programades · CB Sant Josep</title>
  <style>
    :root { --brand:#713f97; --brand-dark:#5a2f7d; --accent:#fcdb20; --bg:#f5f3f8; --card:#fff; --ink:#2a2233; --muted:#7a7085; --line:#e6e0ee; --shadow:0 1px 3px rgba(60,40,90,.08),0 4px 16px rgba(60,40,90,.06); --radius:16px; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; line-height:1.4; }
    header { display:flex; align-items:center; gap:14px; padding:16px 20px; color:#fff; background:var(--brand); box-shadow:var(--shadow); }
    .club-logo { width:48px; height:48px; object-fit:contain; flex-shrink:0; padding:3px; border-radius:10px; background:#fff; }
    .htext { flex:1; min-width:0; }
    .htext h1 { margin:0; font-size:1.05rem; letter-spacing:-.01em; }
    .htext h1 span { display:block; font-size:.72rem; font-weight:500; opacity:.85; letter-spacing:.04em; text-transform:uppercase; }
    .htext p { margin:2px 0 0; font-size:.8rem; opacity:.9; }
    .logo { display:grid; place-items:center; width:48px; height:48px; border-radius:10px; background:#fff; color:var(--brand); font-size:1.55rem; }
    main { max-width:1080px; margin:0 auto; padding:22px 18px 38px; }
    .back { display:inline-flex; margin:0 0 14px; color:var(--brand); font-size:.86rem; font-weight:850; text-decoration:none; }
    .panel { padding:18px; border:1px solid var(--line); border-radius:var(--radius); background:var(--card); box-shadow:var(--shadow); }
    .head { display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; }
    h2 { margin:0; color:var(--brand-dark); font-size:1.15rem; }
    .intro { margin:4px 0 0; color:var(--muted); font-size:.85rem; }
    .kpi { display:flex; align-items:baseline; gap:6px; padding:7px 11px; border:1px solid var(--line); border-radius:999px; background:#faf8fd; }
    .kpi strong { color:var(--brand-dark); font-size:1.2rem; }
    .kpi span { color:var(--muted); font-size:.72rem; font-weight:850; text-transform:uppercase; }
    .filters { display:flex; gap:8px; flex-wrap:wrap; margin:18px 0; }
    .chip { padding:7px 12px; border:1px solid var(--line); border-radius:999px; background:#fff; color:var(--brand); font:inherit; font-size:.78rem; font-weight:850; cursor:pointer; }
    .chip.active { border-color:var(--accent); background:var(--accent); color:#4a3800; }
    .status { min-height:18px; margin:0 0 12px; color:var(--muted); font-size:.78rem; }
    .agenda { display:grid; gap:16px; }
    .day { overflow:hidden; border:1px solid var(--line); border-radius:14px; background:#fff; }
    .day-head { display:flex; justify-content:space-between; gap:12px; align-items:center; padding:12px 14px; background:#faf8fd; border-bottom:1px solid var(--line); }
    .day-head h3 { margin:0; color:var(--brand-dark); font-size:.94rem; text-transform:capitalize; }
    .day-head span { color:var(--muted); font-size:.75rem; font-weight:850; }
    .appointments { display:grid; }
    .appointment { display:grid; grid-template-columns:76px minmax(160px,1fr) minmax(140px,auto); gap:14px; align-items:center; padding:12px 14px; border-bottom:1px solid var(--line); }
    .appointment:last-child { border-bottom:0; }
    .time { color:var(--brand-dark); font-size:1rem; font-weight:900; }
    .player { font-weight:850; }
    .team { display:inline-flex; width:max-content; margin-top:2px; padding:2px 7px; border-radius:999px; background:#f1edf5; color:var(--brand-dark); font-size:.72rem; font-weight:850; }
    .assigned { justify-self:end; color:var(--muted); font-size:.8rem; font-weight:750; text-align:right; }
    .type { display:inline-flex; align-items:center; gap:4px; margin-top:2px; color:var(--brand-dark); font-size:.72rem; font-weight:850; }
    .empty { padding:34px 18px; text-align:center; color:var(--muted); border:1px dashed var(--line); border-radius:14px; }
    footer { padding:0 18px 20px; text-align:center; color:var(--muted); font-size:.75rem; }
    @media (max-width:600px) { main { padding:16px 12px 28px; } .panel { padding:14px; } .appointment { grid-template-columns:62px 1fr; gap:8px 12px; } .assigned { grid-column:2; justify-self:start; text-align:left; } }
  </style>
</head>
<body>
  <header>
    <img class="club-logo" src="assets/santpep-logo.png" alt="Escut CB Sant Josep de Badalona" />
    <div class="htext"><h1><span>CB Sant Josep de Badalona</span>Visites de fisio programades</h1><p>Agenda de les properes cites del servei</p></div>
    <div class="logo" aria-hidden="true">🗓</div>
  </header>
  <main>
    <a class="back" href="fisio-visites.html">← Visites de fisio</a>
    <section class="panel">
      <div class="head">
        <div><h2>Properes visites</h2><p class="intro">Només es mostren cites programades a partir d’avui.</p></div>
        <div class="kpi"><strong id="total">—</strong><span>Visites</span></div>
      </div>
      <div class="filters" id="filters" aria-label="Filtra per professional"></div>
      <p class="status" id="status">Carregant visites programades...</p>
      <div class="agenda" id="agenda"></div>
    </section>
  </main>
  <footer>CB Sant Josep de Badalona · Temporada 26-27</footer>
  <script>
    const FIREBASE_DB_URL = "https://coord-fa09e-default-rtdb.europe-west1.firebasedatabase.app";
    const PUBLIC_REQUESTS_PATH = "physioRequestsPublic/season-26-27";
    const REFRESH_INTERVAL_MS = 30000;
    const totalEl = document.getElementById("total");
    const filtersEl = document.getElementById("filters");
    const statusEl = document.getElementById("status");
    const agendaEl = document.getElementById("agenda");
    let appointments = [];
    let activePhysio = "TOTES";

    function firebaseUrl(path){
      return FIREBASE_DB_URL.replace(/\/$/, "") + "/" + path.split("/").map(encodeURIComponent).join("/") + ".json";
    }
    function todayIso(){
      const now = new Date();
      return now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" + String(now.getDate()).padStart(2, "0");
    }
    function parseDate(date){
      const match = String(date || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
      return match ? new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3])) : null;
    }
    function escapeHtml(value){
      return String(value || "").replace(/[&<>"']/g, char => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[char]));
    }
    function visitType(appointment){
      return String(appointment.visitType || "").toLowerCase() === "readaptacio" || appointment.assignedPhysio === "Miquel Sánchez" ? "Readaptació" : "Fisioteràpia";
    }
    function formatDay(date){
      return new Intl.DateTimeFormat("ca-ES", { weekday:"long", day:"numeric", month:"long" }).format(date);
    }
    function normalize(data){
      const today = todayIso();
      return Object.entries(data || {}).map(([id, request]) => {
        const appointment = request && request.appointment;
        if(!appointment || !appointment.date || !appointment.time || appointment.date < today) return null;
        return { id, date:String(appointment.date), time:String(appointment.time).slice(0, 5), assignedPhysio:String(appointment.assignedPhysio || ""), visitType:appointment.visitType || "", player:request.player || "Jugador/a", team:request.team || "—" };
      }).filter(Boolean).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time) || a.player.localeCompare(b.player, "ca-ES"));
    }
    function renderFilters(){
      const physios = [...new Set(appointments.map(item => item.assignedPhysio).filter(Boolean))].sort((a, b) => a.localeCompare(b, "ca-ES"));
      filtersEl.innerHTML = [{ value:"TOTES", label:"Totes" }].concat(physios.map(name => ({ value:name, label:name }))).map(filter =>
        '<button class="chip ' + (filter.value === activePhysio ? "active" : "") + '" type="button" data-physio="' + escapeHtml(filter.value) + '">' + escapeHtml(filter.label) + '</button>'
      ).join("");
      filtersEl.querySelectorAll("[data-physio]").forEach(button => button.addEventListener("click", () => { activePhysio = button.dataset.physio; render(); }));
    }
    function render(){
      const visible = appointments.filter(item => activePhysio === "TOTES" || item.assignedPhysio === activePhysio);
      totalEl.textContent = visible.length;
      renderFilters();
      if(!visible.length){ agendaEl.innerHTML = '<div class="empty">No hi ha visites programades amb aquest filtre.</div>'; return; }
      const byDay = visible.reduce((groups, item) => { (groups[item.date] ||= []).push(item); return groups; }, {});
      agendaEl.innerHTML = Object.keys(byDay).map(date => {
        const day = parseDate(date);
        const items = byDay[date];
        return '<section class="day"><div class="day-head"><h3>' + escapeHtml(formatDay(day)) + '</h3><span>' + items.length + (items.length === 1 ? ' visita' : ' visites') + '</span></div><div class="appointments">' +
          items.map(item => '<article class="appointment"><div class="time">' + escapeHtml(item.time) + '</div><div><div class="player">' + escapeHtml(item.player) + '</div><span class="team">' + escapeHtml(item.team) + '</span></div><div class="assigned">Visita per ' + escapeHtml(item.assignedPhysio || '—') + '<div class="type">' + (visitType(item) === 'Readaptació' ? '🏃' : '🩺') + ' ' + visitType(item) + '</div></div></article>').join("") +
          '</div></section>';
      }).join("");
    }
    async function load(){
      try {
        const response = await fetch(firebaseUrl(PUBLIC_REQUESTS_PATH), { cache:"no-store" });
        if(!response.ok) throw new Error("Firebase read failed");
        appointments = normalize(await response.json());
        statusEl.textContent = "Agenda actualitzada automàticament.";
      } catch(error) {
        appointments = [];
        statusEl.textContent = "No s'ha pogut carregar l'agenda de visites.";
      }
      render();
    }
    load();
    window.setInterval(load, REFRESH_INTERVAL_MS);
  </script>
</body>
</html>
