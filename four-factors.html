<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>Calculadora 4 Factors · CB Sant Josep</title>
  <style>
    :root {
      --brand:#713f97; --brand-dark:#5a2f7d; --accent:#fcdb20;
      --bg:#f5f3f8; --card:#ffffff; --ink:#2a2233; --muted:#7a7085;
      --line:#e6e0ee; --shadow:0 1px 3px rgba(60,40,90,0.08),0 4px 16px rgba(60,40,90,0.06); --radius:14px;
      --good:#0f766e; --bad:#b42318;
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); min-height:100vh;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      line-height:1.45; -webkit-font-smoothing:antialiased; }
    header { display:flex; align-items:center; gap:14px; padding:16px 20px;
      background:var(--brand); color:#fff; box-shadow:var(--shadow); }
    .club-logo { width:48px; height:48px; object-fit:contain; flex-shrink:0;
      background:#fff; border-radius:10px; padding:3px; }
    .logo-mark { display:inline-grid; place-items:center; width:40px; height:40px; flex-shrink:0; background:#fff; color:var(--brand); border-radius:9px; font-size:1.35rem; font-weight:900; }
    .logo-link { display:inline-flex; cursor:pointer; text-decoration:none; }
    .htext { flex:1; min-width:0; }
    .htext h1 { margin:0; font-size:1.05rem; font-weight:700; }
    .htext h1 .club { display:block; font-size:0.72rem; font-weight:500; opacity:0.85;
      letter-spacing:0.04em; text-transform:uppercase; }
    .htext p { margin:2px 0 0; font-size:0.8rem; opacity:0.9; }
    main { max-width:860px; margin:0 auto; padding:22px 14px 60px; }
    .page-nav { margin:0 0 16px; }
    .back { color:var(--brand); font-weight:800; text-decoration:none; font-size:0.86rem; }
    .toolbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:0 0 16px; }
    .btn { border:1px solid var(--line); background:#fff; color:var(--brand-dark);
      border-radius:8px; padding:9px 12px; font:inherit; font-size:0.85rem; font-weight:800;
      cursor:pointer; }
    .btn.primary { background:var(--brand); border-color:var(--brand); color:#fff; }
    .btn.danger { color:var(--bad); }
    .match-panel { display:grid; grid-template-columns:repeat(4,minmax(0,1fr));
      gap:10px; margin:0 0 16px; padding:12px; border:1px solid var(--line);
      border-radius:12px; background:#fff; box-shadow:var(--shadow); }
    .match-panel label { text-align:left; min-width:0; overflow:hidden; }
    .match-panel input[type="date"] { display:block; width:100%; max-width:100%; min-width:0;
      appearance:none; -webkit-appearance:none; }
    .match-panel input[type="date"]:disabled { color:var(--brand-dark); background:#f4edf8;
      border-color:rgba(113,63,151,0.38); opacity:1; cursor:not-allowed; }
    .match-value { color:var(--brand-dark); font-size:1rem; font-weight:900; line-height:1.2;
      text-transform:none; overflow-wrap:anywhere; }
    .scoreboard-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; align-items:start; }
    .team-card { background:var(--card); border:1px solid var(--line); border-radius:18px;
      box-shadow:var(--shadow); padding:18px 18px 20px; }
    .team-card.local { --team-color:#3498db; }
    .team-card.visitor { --team-color:#ef4438; }
    .team-header { display:grid; grid-template-columns:minmax(0,1fr) 76px; gap:10px; align-items:start;
      border-bottom:4px solid var(--team-color); padding-bottom:12px; margin-bottom:18px; }
    .team-field { color:var(--team-color); align-items:flex-start; text-align:left; }
    .team-field, .score-field { min-width:0; justify-content:start; }
    .score-field { align-items:flex-end; text-align:right; }
    .team-name { color:var(--team-color); font-size:1.35rem; font-weight:900; line-height:1.15;
      text-transform:uppercase; overflow-wrap:anywhere; border:0; border-radius:8px; padding:6px 0;
      background:transparent; text-align:left; }
    .team-name::placeholder { color:var(--team-color); opacity:0.65; }
    .score-value { color:var(--team-color); font-size:1.55rem; font-weight:900; line-height:1.1;
      text-align:right; font-variant-numeric:tabular-nums; }
    .factor-stack { display:grid; gap:0; }
    .factor-section { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(88px,0.85fr);
      gap:14px; align-items:center; padding:22px 0; border-bottom:1px dashed var(--line); }
    .factor-section:first-child { padding-top:4px; }
    .factor-section:last-child { border-bottom:0; padding-bottom:0; }
    .team-card.visitor .factor-section { grid-template-columns:minmax(88px,0.85fr) minmax(0,1.15fr); }
    .control-stack { display:grid; gap:12px; }
    .factor-results { display:grid; gap:9px; }
    .factor-result { display:flex; flex-direction:column; gap:2px; align-items:flex-start; color:#2c4054; }
    .team-card.local .factor-result { align-items:flex-start; }
    .team-card.visitor .factor-result { align-items:flex-end; }
    .factor-result span { font-size:1.08rem; font-weight:900; letter-spacing:0; }
    .factor-result strong { font-size:1.4rem; line-height:1.1; color:#62666c; }
    .factor-result.sub-factor span { font-size:0.78rem; color:var(--muted); }
    .factor-result.sub-factor strong { font-size:1rem; }
    .factor-result.close strong { color:#f59e0b; }
    .factor-result.good strong { color:#22b66f; }
    .factor-result.bad strong { color:#ef4438; }
    .team-summary { display:grid; gap:8px;
      margin-top:18px; padding:14px; border-radius:12px; background:var(--brand-dark); color:#fff; }
    .summary-row { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; }
    .summary-row.secondary { grid-template-columns:repeat(auto-fit,minmax(92px,1fr)); }
    .summary-item { display:flex; flex-direction:column; align-items:center; gap:2px; min-width:0; }
    .summary-item span { color:rgba(255,255,255,0.78); font-size:0.68rem; font-weight:800;
      text-transform:uppercase; letter-spacing:0.03em; text-align:center; }
    .summary-item strong { font-size:1.05rem; font-weight:900; font-variant-numeric:tabular-nums; }
    .formula-summary { margin-top:18px; padding:12px; border:1px solid var(--line);
      border-radius:12px; background:#fff; color:#4b4157; font-size:0.72rem; line-height:1.35; box-shadow:var(--shadow); }
    .formula-summary h3 { margin:0 0 6px; color:var(--brand-dark); font-size:0.76rem; text-transform:uppercase;
      letter-spacing:0.04em; }
    .formula-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:5px 10px; }
    .formula-grid div { min-width:0; }
    .formula-grid strong { color:var(--brand-dark); }
    label { display:flex; flex-direction:column; gap:4px; min-width:0; font-size:0.72rem;
      text-transform:uppercase; letter-spacing:0.04em; color:#62666c; font-weight:800; text-align:center; }
    .counter { display:grid; grid-template-columns:38px minmax(0,1fr) 38px; align-items:stretch; }
    .stepper { border:1px solid var(--line); font:inherit; font-size:1.15rem; font-weight:900;
      cursor:pointer; width:38px; height:38px; border-radius:9px; align-self:center;
      box-shadow:0 1px 2px rgba(60,40,90,0.08); }
    .stepper.minus { background:#fff; color:var(--brand-dark); }
    .stepper.plus { background:var(--accent); color:var(--brand-dark); border-color:#ead02c; }
    .stepper:hover { border-color:var(--brand); background:#f7f0fb; }
    .stepper.plus:hover { background:#ffe75a; }
    input { width:100%; border:1px solid #d7d7d7; border-radius:8px; padding:7px 8px;
      font:inherit; font-size:1rem; color:var(--ink); background:#fff; }
    .counter-value { display:grid; place-items:center; min-width:0; border:1px solid #d7d7d7;
      border-radius:8px; padding:7px 8px; background:#fff; color:var(--ink); font-size:1rem;
      font-weight:900; line-height:1; font-variant-numeric:tabular-nums; }
    input:focus { outline:2px solid rgba(113,63,151,0.18); border-color:var(--brand); }
    .saved-games { margin-top:18px; padding:12px; border:1px solid var(--line);
      border-radius:12px; background:#fff; box-shadow:var(--shadow); }
    .saved-games-header { display:flex; justify-content:space-between; gap:10px; align-items:center; }
    .saved-games h2 { margin:0; font-size:0.98rem; color:var(--brand-dark); }
    .saved-count { color:var(--muted); font-size:0.78rem; font-weight:800; }
    .saved-list { display:grid; gap:8px; margin-top:10px; }
    .saved-empty { color:var(--muted); font-size:0.85rem; margin:8px 0 0; }
    .saved-nav { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:8px; align-items:center; }
    .saved-nav .btn { display:inline-grid; place-items:center; width:32px; height:32px; min-width:0; padding:0; }
    .saved-nav .btn svg { width:17px; height:17px; stroke:currentColor; }
    .saved-nav .btn:disabled { opacity:0.42; cursor:not-allowed; }
    .saved-position { color:var(--muted); font-size:0.72rem; font-weight:800; text-align:center; }
    .saved-game { padding:9px; border:1px solid var(--line); border-radius:8px; }
    .saved-game-heading { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px;
      align-items:start; }
    .saved-game-title { font-weight:900; color:var(--ink); overflow-wrap:anywhere; }
    .saved-team-local { color:#3498db; }
    .saved-team-visitor { color:#ef4438; }
    .saved-score-local { color:#3498db; padding-left:3px; }
    .saved-score-separator { color:var(--ink); padding:0 3px; }
    .saved-score-visitor { color:#ef4438; padding-right:3px; }
    .saved-game-date { color:var(--muted); font-size:0.75rem; font-weight:800; white-space:nowrap; }
    .saved-game-body { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; align-items:start;
      margin-top:7px; }
    .saved-actions { display:grid; gap:6px; align-self:start; }
    .saved-actions .btn { display:inline-grid; place-items:center; width:32px; height:32px; min-width:0;
      padding:0; color:var(--brand-dark); }
    .saved-actions .btn svg { width:16px; height:16px; stroke:currentColor; }
    .saved-actions .btn.danger { color:var(--bad); }
    .saved-summary { display:grid; gap:6px; }
    .saved-summary-row { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; }
    .saved-summary-row.secondary { grid-template-columns:repeat(auto-fit,minmax(72px,1fr)); }
    .saved-summary-item { border:1px solid var(--line); border-radius:8px; padding:5px 6px;
      background:#faf9fc; text-align:center; min-width:0; }
    .saved-summary-item span { display:block; color:var(--muted); font-size:0.62rem;
      font-weight:800; text-transform:uppercase; letter-spacing:0.02em; }
    .saved-summary-item strong { display:block; margin-top:1px; color:var(--ink); font-size:0.82rem;
      font-weight:900; font-variant-numeric:tabular-nums; }
    .status-line { color:var(--muted); font-size:0.78rem; margin-top:8px; min-height:1.1em; }
    footer { text-align:center; color:var(--muted); font-size:0.75rem; padding:20px; }
    @media (max-width:780px) {
      header { gap:8px; padding:8px 10px; }
      .club-logo { width:34px; height:34px; border-radius:8px; padding:2px; }
      .logo-mark { width:34px; height:34px; border-radius:8px; font-size:1.1rem; }
      .htext h1 { font-size:0.86rem; }
      .htext h1 .club { font-size:0.58rem; }
      .htext p { display:none; }
      main { padding:11px 7px 34px; }
      .toolbar { gap:8px; margin-bottom:10px; }
      .btn { padding:8px 10px; font-size:0.8rem; border-radius:8px; }
      .match-panel { grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-bottom:11px; padding:9px;
        border-radius:10px; box-shadow:none; }
      .match-panel label { font-size:0.66rem; }
      .match-panel input[type="date"] { font-size:0.78rem; padding:6px 3px; }
      .match-value { font-size:0.9rem; }
      input { padding:6px 7px; font-size:0.98rem; }
      .scoreboard-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
      .team-card { padding:12px 8px 13px; border-radius:12px; }
      .team-header { grid-template-columns:minmax(0,1fr) 56px; gap:6px;
        border-bottom-width:4px; padding-bottom:8px; margin-bottom:8px; }
      .team-name { font-size:1rem; padding:3px 0; }
      .score-value { font-size:1.28rem; }
      .factor-section { grid-template-columns:minmax(0,1fr) 60px; gap:7px; padding:11px 0; }
      .factor-section:first-child { padding-top:7px; }
      .team-card.visitor .factor-section { grid-template-columns:60px minmax(0,1fr); }
      .team-card.visitor .factor-result { align-items:flex-start; }
      .control-stack { gap:7px; }
      label { gap:3px; font-size:0.66rem; line-height:1.18; }
      .counter { grid-template-columns:31px minmax(0,1fr) 31px; }
      .stepper { width:31px; height:31px; border-radius:8px; font-size:1.12rem; }
      .counter-value { min-height:31px; padding:3px 4px; font-size:1rem; border-radius:8px; }
      .factor-results { gap:4px; }
      .factor-result { gap:1px; }
      .factor-result span { font-size:0.9rem; }
      .factor-result strong { font-size:1.14rem; }
      .factor-result.sub-factor span { font-size:0.66rem; }
      .factor-result.sub-factor strong { font-size:0.88rem; }
      .team-summary { gap:4px; margin-top:12px; padding:12px 8px; border-radius:10px; }
      .summary-row { grid-template-columns:repeat(4,minmax(0,1fr)); gap:4px; }
      .summary-row.secondary { grid-template-columns:repeat(auto-fit,minmax(74px,1fr)); }
      .summary-item { gap:2px; }
      .summary-item span { font-size:0.66rem; }
      .summary-item strong { font-size:1.04rem; }
      .formula-summary { font-size:0.66rem; padding-top:8px; }
      .formula-grid { grid-template-columns:1fr; gap:4px; }
      .saved-summary-row { grid-template-columns:repeat(4,minmax(0,1fr)); gap:4px; }
      .saved-summary-row.secondary { grid-template-columns:repeat(auto-fit,minmax(70px,1fr)); }
      .saved-nav .btn { width:30px; height:30px; }
    }
  </style>
</head>
<body>
  <header>
    <img class="club-logo" src="assets/santpep-logo.png" alt="Escut CB Sant Josep de Badalona" />
    <div class="htext">
      <h1><span class="club">CB Sant Josep de Badalona</span> Calculadora 4 Factors</h1>
      <p>eFG%, TOV%, REB% i FTR%</p>
    </div>
    <span class="logo-mark" aria-hidden="true">🏀</span>
  </header>
  <main>
    <nav class="page-nav" id="backNav" hidden><a class="back" href="equips-4factors.html">← Tornar</a></nav>
    <div class="toolbar">
      <button class="btn primary" type="button" id="saveGameBtn">Guardar</button>
      <button class="btn primary" type="button" id="closeGameBtn">Tancar partit</button>
      <button class="btn danger" type="button" id="resetBtn">Reinicia</button>
      <button class="btn primary" type="button" id="exampleBtn" hidden>Exemple</button>
    </div>

    <section class="match-panel" aria-label="Dades del partit">
      <label class="date-field">Data
        <input id="gameDate" type="date" />
      </label>
      <label>Nom de l'equip
        <span class="match-value" id="matchTeamName">JBF</span>
      </label>
      <label>Categoria
        <span class="match-value" id="matchCategory">1er Any Pref.</span>
      </label>
      <label>Partit
        <span class="match-value" id="matchNumber">1</span>
      </label>
    </section>

    <section class="scoreboard-grid">
      <article class="team-card local" data-side="team">
        <div class="team-header">
          <label class="team-field">Equip local
            <input class="team-name" id="localName" type="text" placeholder="Local" />
          </label>
          <label class="score-field">Punts
            <span class="score-value" id="localScore">0</span>
          </label>
        </div>
        <div class="factor-stack" data-side="team"></div>
      </article>
      <article class="team-card visitor" data-side="opp">
        <div class="team-header">
          <label class="team-field">Equip visitant
            <input class="team-name" id="visitorName" type="text" placeholder="Visitant" />
          </label>
          <label class="score-field">Punts
            <span class="score-value" id="visitorScore">0</span>
          </label>
        </div>
        <div class="factor-stack" data-side="opp"></div>
      </article>
    </section>

    <section class="team-summary" id="teamSummary" aria-label="Resum de l'equip local"></section>

    <section class="saved-games" aria-label="Partits guardats">
      <div class="saved-games-header">
        <h2>Partits guardats</h2>
        <span class="saved-count" id="savedGamesCount">0 partits</span>
      </div>
      <div class="saved-list" id="savedGamesList"></div>
      <div class="status-line" id="saveStatus" role="status" aria-live="polite"></div>
    </section>
    <section class="formula-summary" id="formulasSummary" aria-label="Fórmules utilitzades"></section>

  </main>
  <footer>CB Sant Josep de Badalona · 4 Factors</footer>

  <script>
    const fields = [
      ["fg", "2PM"],
      ["t2i", "2PA"],
      ["tp", "3PM"],
      ["t3i", "3PA"],
      ["ast", "AST"],
      ["fta", "FTA"],
      ["ft", "FTM"],
      ["orb", "OREB"],
      ["drb", "DREB"],
      ["tov", "TO"]
    ];
    const fieldLabels = Object.fromEntries(fields);
    const factorGroups = [
      { key:"efg", fields:["fg", "t2i", "tp", "t3i"] },
      { key:"tov", fields:["ast", "tov"] },
      { key:"reb", fields:["orb", "drb"] },
      { key:"ftfga", fields:["ft", "fta"] }
    ];
    const labels = {
      efg: "eFG%",
      tov: "TOV%",
      reb: "REB%",
      orb: "ORB%",
      drb: "DRB%",
      ftfga: "FTR%",
      ppt2: "PPT2",
      ppt3: "PPT3",
      ppt: "PPT",
      astPct: "% TC assistit"
    };
    const factorWeights = {
      efg: 0.40,
      tov: 0.25,
      reb: 0.20,
      ftfga: 0.15
    };
    const EFFICIENCY_POSSESSION_THRESHOLD = 10;
    // Equips del club que fan servir aquesta calculadora. Cada equip té el
    // seu propi esborrany/llista local i es filtra a Firebase amb teamKey,
    // per no barrejar dades entre equips en el mateix navegador.
    // Claus opaques (no lligades al nom de l'equip) per no facilitar
    // l'accés directe a la calculadora d'un altre equip només mirant la URL.
    const TEAMS = {
      lgf1vqte4cb7: { teamName: "JBF", category: "1er Any Pref." },
      "41zgmppra86l": { teamName: "JAM", category: "Preferent" },
      ibm26p7k4r2s: { teamName: "IBM", category: "1er Any Pref." },
      cfinter26k9p3: { teamName: "CF", category: "Inter" },
      "2j9sj0ah5guu": { teamName: "PCM", category: "Nivell B" }
    };
    const DEFAULT_TEAM_KEY = "lgf1vqte4cb7";
    const params = new URLSearchParams(window.location.search);
    const TEAM_KEY = TEAMS[params.get("t")] ? params.get("t") : DEFAULT_TEAM_KEY;
    const TEAM = TEAMS[TEAM_KEY];
    document.getElementById("backNav").hidden = TEAM.teamName !== "JBF";
    const STORAGE_KEY = "santpep.fourFactors.games." + TEAM_KEY + ".v1";
    const DRAFT_KEY = "santpep.fourFactors.currentDraft." + TEAM_KEY + ".v1";
    const PCM_TEAM_KEY = "2j9sj0ah5guu";
    const EXAMPLE_GAME = {
      date: "2026-09-19",
      localName: "PCM",
      visitorName: "Rival exemple",
      team: { fg: 18, t2i: 39, tp: 6, t3i: 18, ast: 15, fta: 15, ft: 10, orb: 11, drb: 24, tov: 13 },
      opp: { fg: 16, t2i: 42, tp: 4, t3i: 16, ast: 11, fta: 18, ft: 11, orb: 9, drb: 21, tov: 16 }
    };
    const FIREBASE_DB_URL = "https://coord-fa09e-default-rtdb.europe-west1.firebasedatabase.app";
    // Les regles actuals de Firebase només permeten escriure en aquest node.
    // Separem els equips dins el node compartit amb teamKey.
    const FIREBASE_GAMES_PATH = "fourFactorsGames/jbf-1er-any-pref";
    const DEFAULT_MATCH_TEAM_NAME = TEAM.teamName;
    const DEFAULT_MATCH_CATEGORY = TEAM.category;
    let currentGameId = null;
    let savedGamesViewIndex = 0;

    function inputId(side, key){ return side + "-" + key; }
    function n(side, key){
      const el = document.getElementById(inputId(side, key));
      const value = Number(el && el.dataset ? el.dataset.value : 0);
      return Number.isFinite(value) ? value : 0;
    }
    function pct(value){ return Number.isFinite(value) ? (value * 100).toFixed(1) + "%" : "-"; }
    function wholePct(value){ return Number.isFinite(value) ? Math.round(value * 100) + "%" : "-"; }
    function ratio(value){ return Number.isFinite(value) ? value.toFixed(3) : "-"; }
    function ppp(value){ return Number.isFinite(value) ? value.toFixed(2) : "-"; }
    function decimal(value){ return Number.isFinite(value) ? value.toFixed(1) : "-"; }
    function whole(value){ return Number.isFinite(value) ? Math.round(value) : "-"; }
    function safeDiv(a, b){ return b > 0 ? a / b : NaN; }
    function factorFormatter(key){ return key === "ppt2" || key === "ppt3" || key === "ppt" ? ppp : pct; }
    function factorTone(key, own, other){
      const ownValue = own[key];
      const otherValue = other[key];
      if(!Number.isFinite(ownValue) || !Number.isFinite(otherValue) || ownValue === otherValue) return "";
      if(["efg", "tov", "reb", "ftfga"].includes(key) && Math.abs(ownValue - otherValue) < 0.05) return " close";
      const ownIsBetter = key === "tov" ? ownValue < otherValue : ownValue > otherValue;
      return ownIsBetter ? " good" : " bad";
    }
    function calc(side, other){
      const fg = n(side, "fg");
      const fga = fieldGoalAttempts(side);
      const tp = n(side, "tp");
      const t2i = n(side, "t2i");
      const t3i = n(side, "t3i");
      const fta = n(side, "fta");
      const ft = n(side, "ft");
      const ast = n(side, "ast");
      const orb = n(side, "orb");
      const drb = n(side, "drb");
      const tov = n(side, "tov");
      const otherDrb = n(other, "drb");
      const orbRate = safeDiv(orb, orb + n(other, "drb"));
      const drbRate = safeDiv(drb, drb + n(other, "orb"));
      const reboundRate = safeDiv(orb, orb + otherDrb);
      return {
        efg: safeDiv(fieldGoalsMade(side) + 0.5 * tp, fga),
        tov: safeDiv(tov, possessions(side, other)),
        reb: reboundRate,
        orb: orbRate,
        drb: drbRate,
        ftfga: safeDiv(ft, fga),
        ppt2: safeDiv(2 * fg, t2i),
        ppt3: safeDiv(3 * tp, t3i),
        ppt: safeDiv((2 * fg) + (3 * tp), t2i + t3i),
        astPct: safeDiv(ast, fieldGoalsMade(side))
      };
    }
    function render(){
      enforceAttemptMinimums("team");
      enforceAttemptMinimums("opp");
      const team = calc("team", "opp");
      const opp = calc("opp", "team");
      updateScore("team", "localScore");
      updateScore("opp", "visitorScore");
      updateFactors("team", team, opp);

    function points(side){
      return n(side, "fg") * 2 + n(side, "tp") * 3 + n(side, "ft");
    }
    function fieldGoalsMade(side){
      return n(side, "fg") + n(side, "tp");
    }
    function fieldGoalAttempts(side){
      return n(side, "t2i") + n(side, "t3i");
    }
    function totalPlays(side){
      return fieldGoalAttempts(side) + 0.44 * n(side, "fta") + n(side, "tov");
    }
    function teamPossessionEstimate(side){
      return fieldGoalAttempts(side) + 0.44 * n(side, "fta") + n(side, "tov") - n(side, "orb");
    }
    function possessions(side, other){
      return (teamPossessionEstimate(side) + teamPossessionEstimate(other)) / 2;
    }
    function pointsPerPossession(side, other){
      return safeDiv(points(side), possessions(side, other));
    }
    function offensiveEfficiency(side, other){
      return pointsPerPossession(side, other) * 100;
    }
    function defensiveEfficiency(side, other){
      return offensiveEfficiency(other, side);
    }
    function factorShare(key, own, other){
      const ownValue = own[key];
      const otherValue = other[key];
      if(!Number.isFinite(ownValue) || !Number.isFinite(otherValue)) return NaN;
      if(ownValue === 0 && otherValue === 0) return 0.5;
      if(key === "tov") return safeDiv(otherValue, ownValue + otherValue);
      return safeDiv(ownValue, ownValue + otherValue);
    }
    function factorWinRate(ownFactors, otherFactors){
      let weighted = 0;
      let totalWeight = 0;
      Object.entries(factorWeights).forEach(([key, weight]) => {
        const share = factorShare(key, ownFactors, otherFactors);
        if(!Number.isFinite(share)) return;
        weighted += share * weight;
        totalWeight += weight;
      });
      return totalWeight > 0 ? weighted / totalWeight : NaN;
    }
    function scoreWinRate(side, other){
      const ownPoints = points(side);
      const otherPoints = points(other);
      if(ownPoints === 0 && otherPoints === 0) return NaN;
      if(ownPoints === otherPoints) return 0.5;
      const exponent = 3;
      return safeDiv(Math.pow(ownPoints, exponent), Math.pow(ownPoints, exponent) + Math.pow(otherPoints, exponent));
    }
    function winRate(side, other, ownFactors, otherFactors){
      const scoreRate = scoreWinRate(side, other);
      const factorRate = factorWinRate(ownFactors, otherFactors);
      if(!Number.isFinite(scoreRate)) return factorRate;
      if(!Number.isFinite(factorRate)) return scoreRate;
      const pointMargin = Math.abs(points(side) - points(other));
      const totalPoints = points(side) + points(other);
      const scoreWeight = Math.min(0.95, 0.45 + pointMargin / 50 * 0.35 + totalPoints / 160 * 0.10);
      return scoreRate * scoreWeight + factorRate * (1 - scoreWeight);
    }

    function adjustInput(id, delta){

      setCounterValue(id, next);
      if(key === "fg" && delta !== 0) {
        setCounterValue(inputId(side, "t2i"), n(side, "t2i") + (next - current));
      }
      if(key === "tp" && delta !== 0) {
        setCounterValue(inputId(side, "t3i"), n(side, "t3i") + (next - current));

      if(key === "ft" && delta !== 0) {

    function normalizeRemoteGames(data){

      return games.filter(gameBelongsToCurrentTeam);

        const current = byId.get(game.id);
        const currentDate = current ? String(current.updatedAt || current.savedAt || "") : "";
        const nextDate = String(game.updatedAt || game.savedAt || "");
        if(!current || nextDate >= currentDate) byId.set(game.id, game);
      });
      return [...byId.values()];
    }
    async function fetchFirebaseGames(){

        const remote = await fetchFirebaseGames();
        const merged = mergeSavedGames(local, remote);
        writeSavedGames(merged);
        const remoteIds = new Set(remote.map(game => game.id));
        await Promise.all(merged.filter(game => !remoteIds.has(game.id)).map(saveFirebaseGame));
        return merged;

    function iconHtml(name){
      if(name === "load") {
        return '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
          '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>' +
          '<path d="M7 10l5 5 5-5"></path>' +
          '<path d="M12 15V3"></path></svg>';
      }
      if(name === "prev") {
        return '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
          '<path d="M15 18l-6-6 6-6"></path></svg>';
      }
      if(name === "next") {
        return '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
          '<path d="M9 18l6-6-6-6"></path></svg>';
      }
      return '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '<path d="M3 6h18"></path><path d="M8 6V4h8v2"></path>' +
        '<path d="M19 6l-1 14H6L5 6"></path><path d="M10 11v5"></path><path d="M14 11v5"></path></svg>';
    }
    function savedSummaryHtml(game){
      const summary = game.summary || {};
      const primaryItems = [
        ["Win Rate", wholePct(summary.winRate)],
        ["Possessions", whole(summary.possessions)],
        ["OER", decimal(summary.oer)],
        ["DER", decimal(summary.der)]
      ];
      const secondaryItems = [
        ["PPT2", ppp(summary.formulas && summary.formulas.ppt2)],
        ["PPT3", ppp(summary.formulas && summary.formulas.ppt3)],
        ["PPT", ppp(summary.formulas && summary.formulas.ppt)],
        ["% TC AST", pct(summary.formulas && summary.formulas.assistedFieldGoalPct)],
        ["% Pèrdues", pct(summary.formulas && summary.formulas.turnoverPct)]
      ];
      return '<div class="saved-summary">' +
        '<div class="saved-summary-row">' + summaryItemsHtml(primaryItems, "saved-summary-item") + '</div>' +
        '<div class="saved-summary-row secondary">' + summaryItemsHtml(secondaryItems, "saved-summary-item") + '</div>' +
        '</div>';
    }
    function clampSavedGamesViewIndex(total){
      savedGamesViewIndex = Math.max(0, Math.min(savedGamesViewIndex, Math.max(0, total - 1)));
    }
    function savedNavButton(label, icon, disabled, onClick){
      const button = document.createElement("button");
      button.className = "btn";
      button.type = "button";
      button.title = label;
      button.setAttribute("aria-label", label);
      button.innerHTML = iconHtml(icon);
      button.disabled = disabled;
      button.addEventListener("click", onClick);
      return button;
    }
    async function moveSavedGamesView(delta, games){
      savedGamesViewIndex += delta;
      await renderSavedGames(games);
    }
    function efficiencySummaryItems(possessionsValue, oer, der){
      if(Number.isFinite(possessionsValue) && possessionsValue < EFFICIENCY_POSSESSION_THRESHOLD) {
        return [
          ["PPP", ppp(oer / 100)],
          ["DPP", ppp(der / 100)]
        ];
      }
      return [
        ["OER", decimal(oer)],
        ["DER", decimal(der)]
      ];
    }
    function summaryItemsHtml(items, className){
      return items.map(([label, value]) =>
        '<div class="' + className + '"><span>' + label + '</span><strong>' + value + '</strong></div>'
      ).join("");
    }
    async function renderSavedGames(gamesOverride){
      const list = document.getElementById("savedGamesList");
      const count = document.getElementById("savedGamesCount");
      const sourceGames = gamesOverride || await readSyncedSavedGames();
      const games = sourceGames.sort((a, b) => String(b.updatedAt || "").localeCompare(String(a.updatedAt || "")));
      clampSavedGamesViewIndex(games.length);
      updateMatchNumber(games);
      count.textContent = games.length === 1 ? "1 partit" : games.length + " partits";
      list.innerHTML = "";
      if(!games.length) {
        const empty = document.createElement("p");
        empty.className = "saved-empty";
        empty.textContent = "Encara no hi ha cap partit guardat.";
        list.appendChild(empty);
        return;
      }
      const game = games[savedGamesViewIndex];
      const nav = document.createElement("div");
      nav.className = "saved-nav";
      const newer = savedNavButton("Endarrere", "prev", savedGamesViewIndex === games.length - 1, () => moveSavedGamesView(1, games));
      const older = savedNavButton("Endavant", "next", savedGamesViewIndex === 0, () => moveSavedGamesView(-1, games));
      const position = document.createElement("div");
      position.className = "saved-position";
      position.textContent = "Partit " + (games.length - savedGamesViewIndex) + " de " + games.length;
      nav.append(newer, position, older);
      const item = document.createElement("article");
      item.className = "saved-game";
      if(game.id === currentGameId) item.style.borderColor = "var(--brand)";
      const text = document.createElement("div");
      const title = document.createElement("div");
      title.className = "saved-game-title";
      title.innerHTML = formatSavedTitle(game);
      const date = document.createElement("div");
      date.className = "saved-game-date";
      date.textContent = formatSavedDate(game);
      const heading = document.createElement("div");
      heading.className = "saved-game-heading";
      heading.append(title, date);
      const summary = document.createElement("div");
      summary.innerHTML = savedSummaryHtml(game);
      const load = document.createElement("button");
      load.className = "btn";
      load.type = "button";
      load.title = "Carrega";
      load.setAttribute("aria-label", "Carrega partit");
      load.innerHTML = iconHtml("load");
      load.addEventListener("click", () => loadGame(game.id));
      const remove = document.createElement("button");
      remove.className = "btn danger";
      remove.type = "button";
      remove.title = "Elimina";
      remove.setAttribute("aria-label", "Elimina partit");
      remove.innerHTML = iconHtml("delete");
      remove.addEventListener("click", () => deleteGame(game.id));
      const actions = document.createElement("div");
      actions.className = "saved-actions";
      actions.append(load, remove);
      const body = document.createElement("div");
      body.className = "saved-game-body";
      body.append(summary.firstChild, actions);
      text.append(heading, body);
      item.append(text);
      list.append(nav, item);
    }
    function setSaveStatus(message){
      const status = document.getElementById("saveStatus");
      if(status) status.textContent = message;
    }
    document.getElementById("saveGameBtn").onclick = saveDraft;
    document.getElementById("closeGameBtn").onclick = closeGame;
    document.getElementById("exampleBtn").onclick = loadExampleGame;
    document.getElementById("resetBtn").onclick = () => {
      if(!statsStarted()) return;
      const ok = window.confirm("Segur que vols reiniciar la calculadora?");
      if(!ok) return;
      currentGameId = null;
      clearDraft();
      resetMatchDefaults();
      document.getElementById("localName").value = "";
      document.getElementById("visitorName").value = "";
      document.querySelectorAll(".counter-value").forEach(value => {
        value.dataset.value = "0";
        value.textContent = "0";
      });
      render();
      renderSavedGames();
      setSaveStatus("");
    };
    document.getElementById("exampleBtn").hidden = TEAM_KEY !== PCM_TEAM_KEY;
    document.title = "Calculadora 4 Factors · " + TEAM.teamName + " · CB Sant Josep";
    resetMatchDefaults();
    buildInputs();
    document.getElementById("formulasSummary").innerHTML = formulasSummaryHtml();
    restoreDraft();
    render();
    renderSavedGames();
  </script>
</body>
</html>
