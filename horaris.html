<html lang="ca">
<head>

  <style>
    :root {
      --brand: #713f97;
      --brand-dark: #5a2f7d;
      --accent: #fcdb20;
      --bg: #f5f3f8;
      --card: #ffffff;
      --ink: #2a2233;
      --muted: #7a7085;
      --line: #e6e0ee;
      --shadow: 0 1px 3px rgba(60,40,90,0.08), 0 4px 16px rgba(60,40,90,0.06);
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.45; -webkit-font-smoothing: antialiased;
    }
    header {
      display: flex; align-items: center; gap: 14px;
      padding: 16px 20px; background: var(--brand); color: #fff;
      position: sticky; top: 0; z-index: 10; box-shadow: var(--shadow);
    }
    .club-logo { width: 46px; height: 46px; object-fit: contain; flex-shrink: 0; }
    .logo-mark { display:inline-grid; place-items:center; width:40px; height:40px; flex-shrink:0; background:#fff; color:var(--brand); border-radius:9px; font-size:1.35rem; font-weight:900; }
    .logo-link { display: inline-flex; cursor: pointer; text-decoration: none; }
    .htext { flex:1; min-width:0; }
    .htext h1 { margin: 0; font-size: 1.05rem; font-weight: 700; letter-spacing: -0.01em; }
    .htext h1 .club { display: block; font-size: 0.72rem; font-weight: 500;
      opacity: 0.85; letter-spacing: 0.04em; text-transform: uppercase; }
    .htext p { margin: 2px 0 0; font-size: 0.8rem; opacity: 0.9; }
    main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
    .week-pager {
      display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 8px; align-items: center; margin-bottom: 22px;
    }
    .week-current {
      min-height: 38px; display: grid; place-items: center;
      border: 1px solid var(--brand); border-radius: 999px;
      background: var(--brand); color: #fff; font-size: 0.92rem;
      font-weight: 800; text-align: center; padding: 0 12px;
    }
    .nav-arrow {
      display: inline-grid; place-items: center; width: 38px; height: 38px;
      border: 1px solid var(--line); border-radius: 999px;
      background: var(--card); color: var(--brand); cursor: pointer;
      transition: all 0.15s;
    }
    .nav-arrow:hover:not(:disabled) { border-color: var(--brand); background: #faf7fd; }
    .nav-arrow svg { width: 18px; height: 18px; stroke: currentColor; }
    .nav-arrow:disabled { opacity: 0.42; cursor: not-allowed; }
    .filters { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; align-items: stretch; }
    .filter-row { display: grid; grid-template-columns: 82px minmax(0, 1fr); gap: 8px; align-items: center; }
    .filter-options { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; min-width: 0; }

    .chip.active { background: var(--accent); color: #4a3800; border-color: var(--accent); }

    .chip.sex-fem { border-color: #c2185b; color: #c2185b; }
    .chip.sex-fem.active { background: #c2185b; color: #fff; border-color: #c2185b; }
    .empty-filter { color: var(--muted); font-style: italic; text-align: center; padding: 40px 0; }
    .section-title {
      font-size: 1.15rem; font-weight: 700; margin: 26px 0 4px; color: var(--brand-dark);
    }

    .slot-line { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 2px 0; }
    .slot-cat { text-align: center; }

    .slot-line.masc, .slot-line.fem, .slot-line.tec { padding: 3px 8px; border-radius: 6px; }

    .slot-line.fem { border-left: 4px solid #c2185b; border-right: 4px solid #c2185b; background: #fdf3f7; }

    .notes { background: #fff8dc; border: 1px solid #f0e0a0; border-radius: 10px;

    .empty { color: var(--muted); font-style: italic; font-size: 0.8rem; }
    footer { text-align: center; color: var(--muted); font-size: 0.75rem; padding: 20px; }
    @media (max-width: 640px) {
      .days { grid-template-columns: 1fr; }
      .day { border-right: none; }
    }
      .page-nav { margin:0 0 16px; }
    .back { color:var(--brand); font-weight:800; text-decoration:none; font-size:0.86rem; }

    const DATA = JSON.parse(document.getElementById("horarisData").textContent);
    const GOOGLE_SHEET_ID = "1IPWuZUmR3ArzT67gRW3q4R2OdchJ-cNE8b_IN1oI17Q";

    const DAYS = ["Dilluns","Dimarts","Dimecres","Dijous","Divendres","Dissabte","Diumenge"];

    function setLoadStatus(text, tone){
      const old = document.getElementById("sheetStatus");
      if(old) old.remove();
      if(!text) return;
      const el = document.createElement("p");
      el.id = "sheetStatus";
      el.className = "section-sub";
      el.style.marginTop = "-10px";
      el.style.color = tone === "error" ? "#d64545" : "var(--muted)";
      el.textContent = text;
      document.querySelector("main").insertBefore(el, document.getElementById("filters"));
    }

    function navIcon(name){
      const path = name === "prev" ? "M15 18l-6-6 6-6" : "M9 18l6-6-6-6";
      return '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + path + '"></path></svg>';
    }

    function todayInfo(){
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Europe/Madrid",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        weekday: "short"
      }).formatToParts(new Date());
      const byType = Object.fromEntries(parts.map(p => [p.type, p.value]));
      const weekMap = { Mon: 0, Tue: 1, Wed: 2, Thu: 3, Fri: 4, Sat: 5, Sun: 6 };
      return {
        iso: byType.year + "-" + byType.month + "-" + byType.day,
        dayIndex: weekMap[byType.weekday]
      };
    }
    const TODAY = todayInfo();

    function todayIndexForCurrentView(){
      const currentView = VIEWS[currentIdx];
      if(!currentView) return -1;
      if(!currentView.dates) return TODAY.dayIndex;
      return TODAY.iso >= currentView.dates[0] && TODAY.iso <= currentView.dates[1]
        ? TODAY.dayIndex
        : -1;
    }

    function venuePin(name){ return "📍"; }

    // --- Filtres per categoria ---
    const FAMILY_ORDER = ["SÈNIOR","JÚNIOR","CADET","INFANTIL","MINI","PREMINI","ESCOLA","TECNIFICACIÓ","ALTRES"];
    const SEASON_ONLY_FILTERS = new Set(["MINI","ESCOLA","TECNIFICACIÓ","ALTRES"]);
    // Gènere d'una categoria a partir del sufix MASC/FEM del text.
    // Retorna 'masc', 'fem' o '' (sense gènere, p. ex. TECNIFICACIÓ, MIXTE).
    function sexOf(cat){
      const c = cat.toUpperCase();
      if(/TECNIFICACI/.test(c)) return 'tec'; // gris (mateixa simbologia)
      const hasMasc = /\bMASC\b/.test(c);
      const hasFem = /\bFEM\b/.test(c);
      if(/\b(PBM|PAM)\b/.test(c)) return 'masc';
      if(hasMasc && !hasFem) return 'masc';
      if(hasFem && !hasMasc) return 'fem';
      return ''; // sense gènere o mixt (no s'hi aplica color)
    }

    // Text de categoria sense el marcador de gènere (MASC/FEM), que ara
    // s'identifica pel color. Neteja separadors i espais sobrants.
    function catLabel(cat){
      return cat
        .replace(/\bMASC\b/gi, '')
        .replace(/\bFEM\b/gi, '')
        .replace(/\s*\/\s*/g, ' / ')
        .replace(/\s{2,}/g, ' ')
        .replace(/\s*\/\s*$/,'')
        .replace(/^\s*\/\s*/,'')
        .trim();
    }

    function familyOf(cat){
      const c = cat.toUpperCase();
      const f = [];
      if(/INFANTIL/.test(c)) f.push("INFANTIL");
      if(/CADET/.test(c)) f.push("CADET");
      if(/JÚNIOR/.test(c)) f.push("JÚNIOR");
      if(/SÈNIOR/.test(c)) f.push("SÈNIOR");
      if(/PREMINI/.test(c)) f.push("PREMINI");
      else if(/\bMINI\b/.test(c)) f.push("MINI");
      if(/ESCOLA/.test(c)) f.push("ESCOLA");
      if(/TECNIFICAC/.test(c)) f.push("TECNIFICACIÓ");
      if(/ESTRELLA|\bPAM\b|\bPBM\b/.test(c)) f.push("ALTRES");
      if(!f.length) f.push("ALTRES");
      return f;
    }
    const activeFilters = new Set(); // buit = mostra totes les categories
    const activeSex = new Set(); // buit = mostra tots els gèneres
    function passesFilter(cat){
      const okFam = activeFilters.size === 0 || familyOf(cat).some(fam => activeFilters.has(fam));
      const sx = sexOf(cat);
      const okSex = activeSex.size === 0 || activeSex.has(sx);
      return okFam && okSex;
    }

    function normalizeSheetText(value){
      return String(value == null ? "" : value).replace(/\s+/g, " ").trim();
    }

    function normalizeSheetTime(value){
      return normalizeSheetText(value)
        .replace(".", ":")
        .replace(/^(\d{1,2}:\d{2}):(\d{1,2})$/, "$1-$2:00")
        .replace(/^(\d{1,2}:\d{2}):(\d{1,2}:\d{2})$/, "$1-$2");
    }

    function normalizeSheetCategory(value){
      return normalizeSheetText(value)
        .replace(/\bJUNIOR\b/g, "JÚNIOR")
        .replace(/\bSENIOR\b/g, "SÈNIOR");
    }

    function normalizeSheetVenue(value){
      return normalizeSheetText(value)
        .replace(/\bPAVELLO\b/g, "PAVELLÓ");
    }

    function tableValue(row, index){
      const cell = row && row.c && row.c[index];
      return cell ? (cell.f != null ? cell.f : cell.v) : "";
    }

    function initialVenueFromSheet(table){
      const label = table && table.cols && table.cols[1] ? table.cols[1].label || "" : "";
      const match = label.match(/DILLUNS\s+(.+)$/i);
      return normalizeSheetVenue(match ? match[1] : "PAVELLÓ DE LA COLINA");
    }

    function rowIsVenueHeader(row){
      const first = normalizeSheetText(tableValue(row, 1));
      if(!first || /\d/.test(first)) return "";
      const hasTraining = [3,6,9,12,15].some(index => normalizeSheetText(tableValue(row, index)));
      return hasTraining ? "" : normalizeSheetVenue(first);
    }

    function inferredEnricBorrasCategory(venueName, dayIndex, time){
      if(!/ENRIC BORRAS/i.test(venueName)) return "";
      if(dayIndex === 2 && time === "18:00-19:30") return "MINI A MASC";
      if(dayIndex === 3 && time === "17:00-18:00") return "TECNIFICACIÓ";
      if(dayIndex === 3 && time === "18:00-19:30") return "MINI FEM";
      if(dayIndex === 4 && time === "18:00-19:30") return "MINI B MASC";
      return "";
    }

    function parseSeasonFromGoogleTable(table){
      const dayStarts = [1,4,7,10,13];
      const venues = [];
      const notes = [];
      let current = { name: initialVenueFromSheet(table), days: [[],[],[],[],[]] };
      venues.push(current);

      (table.rows || []).forEach(row => {
        const venueName = rowIsVenueHeader(row);
        if(venueName){
          current = { name: venueName, days: [[],[],[],[],[]] };
          venues.push(current);
        } else {
          dayStarts.forEach((start, dayIndex) => {
            const time = normalizeSheetTime(tableValue(row, start));
            const court = normalizeSheetText(tableValue(row, start + 1));
            const explicitCat = normalizeSheetCategory(tableValue(row, start + 2));
            const cat = explicitCat || inferredEnricBorrasCategory(current.name, dayIndex, time);
            if(!time || !cat || /^DISPONIBLE$/i.test(cat)) return;
            current.days[dayIndex].push({ time, court, cat });
          });
        }

        for(let i = 16; i < (row.c || []).length; i++){
          const note = normalizeSheetText(tableValue(row, i));
          if(note && !notes.includes(note)) notes.push(note);
        }
      });

      return {
        venues: venues.filter(venue => venue.days.some(day => day.length)),
        notes
      };
    }

    function loadGoogleSheetTable(){
      return new Promise((resolve, reject) => {
        const callback = "__horarisSheetCallback_" + Date.now();
        const script = document.createElement("script");
        const timeout = window.setTimeout(() => {
          cleanup();
          reject(new Error("Timeout carregant Google Sheet"));
        }, 12000);
        function cleanup(){
          window.clearTimeout(timeout);
          delete window[callback];
          if(script.parentNode) script.parentNode.removeChild(script);
        }
        window[callback] = payload => {
          cleanup();
          if(!payload || payload.status !== "ok" || !payload.table) {
            reject(new Error("Resposta invàlida del Google Sheet"));
            return;
          }
          resolve(payload.table);
        };
        script.src = "https://docs.google.com/spreadsheets/d/" + GOOGLE_SHEET_ID +
          "/gviz/tq?tqx=responseHandler:" + callback + ";out:json&sheet=" +
          encodeURIComponent(GOOGLE_SHEET_NAME) + "&tq=" + encodeURIComponent("select *") +
          "&cacheBust=" + Date.now();
        script.onerror = () => {
          cleanup();
          reject(new Error("No s'ha pogut carregar Google Sheet"));
        };
        document.head.appendChild(script);
      });
    }

    async function refreshSeasonFromGoogleSheet(){
      const table = await loadGoogleSheetTable();
      const season = parseSeasonFromGoogleTable(table);
      if(!season.venues.length) throw new Error("La pestanya no conté horaris de temporada");
      DATA.season = season;
    }

    function venuesForCurrentView(){
      const currentView = VIEWS[currentIdx];
      return currentView && !currentView.dates ? DATA.season.venues : DATA.pre[currentIdx].venues;
    }

    function visibleDayCount(){
      let count = 5;
      venuesForCurrentView().forEach(v => {
        (v.days || []).forEach((day, i) => {
          if(i >= 5 && day.some(s => passesFilter(s.cat))) count = Math.max(count, i + 1);
        });
      });
      return Math.min(count, DAYS.length);
    }

    function renderVenue(v){
      let daysHtml = "";
      const todayIdx = todayIndexForCurrentView();
      const dayCount = visibleDayCount();
      let hasVisibleSlots = false;
      const hideCourt = /BUFAL/i.test(v.name); // a Bufalà no es mostra l'etiqueta de pista
      for(let i = 0; i < dayCount; i++){
        const day = v.days[i] || [];
        const day0 = day.filter(s => passesFilter(s.cat));
        const isToday = i === todayIdx;
        // Agrupa les entrades per hora, mantenint l'ordre d'aparició
        const groups = [];
        const byTime = {};
        day0.forEach(s => {
          if(!(s.time in byTime)){ byTime[s.time] = []; groups.push(s.time); }
          byTime[s.time].push(s);
        });
        const slots = groups.map(time => {
          const lines = byTime[time].map(s => {
            const sx = sexOf(s.cat); // '', 'masc' o 'fem' → color de gènere
            return '<div class="slot-line' + (sx ? ' ' + sx : '') + '">' +
              ((s.court && !hideCourt)
                ? '<span class="slot-court">' + (/^H$/i.test(s.court)?"Tota pista":"Pista "+s.court) + '</span>'
                : '') +
              '<span class="slot-cat">' + catLabel(s.cat) + '</span></div>';
          }).join("");
          return '<div class="slot' + (isToday ? ' today-slot' : '') + '"><div class="slot-time">' + time + '</div>' + lines + '</div>';
        }).join("");
        if(day0.length) hasVisibleSlots = true;
        daysHtml += '<div class="day' + (isToday ? ' today' : '') + (!day0.length ? ' empty-day' : '') +
          '"><div class="day-name">' + DAYS[i] +
          (isToday ? '<span class="today-badge">Avui</span>' : '') + '</div>' + slots + '</div>';
      }
      if(!hasVisibleSlots) return ""; // cap franja passa el filtre en aquesta instal·lació
      return '<div class="venue"><div class="venue-head"><span class="pin">' + venuePin(v.name) +
        '</span>' + v.name + '</div><div class="days" style="--day-count:' + dayCount + '">' + daysHtml + '</div></div>';
    }

    const VIEWS = [];
    // Rangs de dates per detectar la setmana que s'ha de mostrar en carregar.
    // Dissabte i diumenge ja es consideren preparació de la setmana següent.
    const PRE_DATES = {
      "17-21": ["0000-01-01","2026-08-21"],
      "24-28": ["2026-08-22","2026-08-28"],
      "31":    ["2026-08-29","2026-09-04"]
    };
    DATA.pre.forEach(w => VIEWS.push({
      label: "Agost " + w.range,
      dates: PRE_DATES[w.range] || null,
      render: () =>
        '<div class="section-title">Pretemporada · Agost ' + w.range + '</div>' +
        '<p class="section-sub">Setmana del ' + w.range + ' d\'agost</p>' +
        w.venues.map(renderVenue).join("")
    }));
    VIEWS.push({
      label: "Temporada 26-27",
      dates: null,
      render: () => {
        return '<div class="section-title">Proposta horaris temporada 26-27</div>' +
          '<p class="section-sub">Horari setmanal per instal·lació</p>' +
          DATA.season.venues.map(renderVenue).join("");
      }
    });

    let currentIdx = 0;
    function renderContent(){
      const html = VIEWS[currentIdx].render();
      content.innerHTML = html.trim()
        ? html
        : '<p class="empty-filter">Cap entrenament per als filtres seleccionats.</p>';
    }
    function show(idx){
      currentIdx = Math.max(0, Math.min(idx, VIEWS.length - 1));
      buildFilters();
      renderContent();
      currentViewLabelEl.textContent = VIEWS[currentIdx].label;
      prevViewEl.disabled = currentIdx <= 0;
      nextViewEl.disabled = currentIdx >= VIEWS.length - 1;
      window.scrollTo({top:0, behavior:"smooth"});
    }
    prevViewEl.innerHTML = navIcon("prev");
    nextViewEl.innerHTML = navIcon("next");
    prevViewEl.onclick = () => { if(currentIdx > 0) show(currentIdx - 1); };
    nextViewEl.onclick = () => { if(currentIdx < VIEWS.length - 1) show(currentIdx + 1); };

    // Construeix els chips de filtre per gènere i categoria.
    function buildFilters(){
      const present = new Set();
      const presentSex = new Set();
      const scan = v => v.days.forEach(day => day.forEach(s => {
        familyOf(s.cat).forEach(f=>present.add(f));
        const sx = sexOf(s.cat);
        if(sx === 'masc' || sx === 'fem') presentSex.add(sx);
      }));
      const currentView = VIEWS[currentIdx];
      const isSeason = !currentView.dates;
      if(isSeason) DATA.season.venues.forEach(scan);
      else DATA.pre[currentIdx].venues.forEach(scan);
      const fams = FAMILY_ORDER.filter(f =>
        present.has(f) && (isSeason || !SEASON_ONLY_FILTERS.has(f))
      );
      const sexes = [
        ['masc','Masculí','sex-masc'],
        ['fem','Femení','sex-fem']
      ].filter(s => presentSex.has(s[0]));
      activeFilters.forEach(f => {
        if(!fams.includes(f)) activeFilters.delete(f);
      });
      activeSex.forEach(s => {
        if(!sexes.some(x => x[0] === s)) activeSex.delete(s);
      });

      const filtersEl = document.getElementById("filters");
      filtersEl.innerHTML = "";
      function row(text){
        const wrap = document.createElement("div");
        wrap.className = "filter-row";
        const lbl = document.createElement("span");
        lbl.className = "filters-label"; lbl.textContent = text;
        const opts = document.createElement("div");
        opts.className = "filter-options";
        wrap.appendChild(lbl);
        wrap.appendChild(opts);
        filtersEl.appendChild(wrap);
        return opts;
      }

      const sexGroup = row("Gènere:");
      const allSexChip = document.createElement("button");
      allSexChip.className = "chip chip-all sex-all active"; allSexChip.textContent = "Tots";
      allSexChip.onclick = () => { activeSex.clear(); syncChips(); renderContent(); };
      sexGroup.appendChild(allSexChip);
      sexes.forEach(s => {
        const b = document.createElement("button");
        b.className = "chip " + s[2]; b.textContent = s[1]; b.dataset.sex = s[0];
        b.onclick = () => {
          if(activeSex.has(s[0])) activeSex.delete(s[0]); else activeSex.add(s[0]);
          syncChips(); renderContent();
        };
        sexGroup.appendChild(b);
      });

      const famGroup = row("Categoria:");
      const allChip = document.createElement("button");
      allChip.className = "chip chip-all active"; allChip.textContent = "Tots";
      allChip.onclick = () => { activeFilters.clear(); syncChips(); renderContent(); };
      famGroup.appendChild(allChip);

      fams.forEach(fam => {
        const b = document.createElement("button");
        b.className = "chip"; b.textContent = fam; b.dataset.fam = fam;
        b.onclick = () => {
          if(activeFilters.has(fam)) activeFilters.delete(fam); else activeFilters.add(fam);
          syncChips(); renderContent();
        };
        famGroup.appendChild(b);
      });

      function syncChips(){
        allSexChip.classList.toggle("active", activeSex.size === 0);
        [...filtersEl.querySelectorAll(".chip[data-sex]")].forEach(c =>
          c.classList.toggle("active", activeSex.has(c.dataset.sex)));
        allChip.classList.toggle("active", activeFilters.size === 0);
        [...filtersEl.querySelectorAll(".chip[data-fam]")].forEach(c =>
          c.classList.toggle("active", activeFilters.has(c.dataset.fam)));
      }
    }
    // Selecciona per defecte la vista de la setmana on estiguem (segons la data d'avui).
    // Si avui cau dins d'un rang de pretemporada, obre aquella setmana; si no, la temporada 26-27.
    function defaultView(){
      const now = new Date();
      const today = now.getFullYear() + "-" +
        String(now.getMonth()+1).padStart(2,"0") + "-" +
        String(now.getDate()).padStart(2,"0");
      for(let i=0;i<VIEWS.length;i++){
        const d = VIEWS[i].dates;
        if(d && today >= d[0] && today <= d[1]) return i;
      }
      return VIEWS.length-1; // temporada 26-27
    }

    async function init(){
      setLoadStatus("Carregant horaris des del Google Sheet...");
      try {
        await refreshSeasonFromGoogleSheet();
        setLoadStatus("Horaris de temporada carregats des del Google Sheet.");
      } catch(error) {
        console.error(error);
        DATA.season = { venues: [], notes: [] };
        setLoadStatus("No s'ha pogut carregar el Google Sheet. La temporada no es pot mostrar sense aquesta font.", "error");
      }
      buildFilters();
      show(defaultView());
    }

    init();
  </script>
</body>
</html>
