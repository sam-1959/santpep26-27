<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>Consulta d'incidències · Badalona Bàsquet Base</title>
  <style>
    :root { --blue:#075985; --blue-dark:#0c4a6e; --bg:#f4f7f9; --card:#fff; --ink:#172033; --muted:#64748b; --line:#dbe4ea; --ok:#166534; --warn:#b45309; --radius:14px; --shadow:0 3px 16px rgba(15,41,61,.08); }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; color:var(--ink); background:var(--bg); font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }
    header { padding:16px 20px; color:#fff; background:linear-gradient(120deg,var(--blue-dark),var(--blue)); } .header-inner, main, footer { width:min(1240px,calc(100% - 30px)); margin:0 auto; }
    .header-inner { display:flex; align-items:center; gap:13px; } .header-logo { width:52px; height:52px; padding:3px; object-fit:contain; border-radius:9px; background:#fff; } h1 { margin:0; font-size:1.25rem; } .sub { margin:2px 0 0; opacity:.86; font-size:.82rem; }
    main { padding:24px 0 42px; } .panel { margin-bottom:16px; padding:18px; border:1px solid var(--line); border-radius:var(--radius); background:var(--card); box-shadow:var(--shadow); } h2 { margin:0; color:var(--blue-dark); font-size:1.08rem; }
    .auth { display:flex; gap:14px; align-items:center; justify-content:space-between; } .auth p { margin:5px 0 0; color:var(--muted); } button { border:0; border-radius:9px; padding:9px 13px; background:var(--blue); color:#fff; font:inherit; font-weight:800; cursor:pointer; } button:hover { background:var(--blue-dark); } button.secondary { color:var(--blue-dark); background:#e0f2fe; } button:disabled { opacity:.55; cursor:wait; }
    .content[hidden] { display:none; } .filters { display:grid; grid-template-columns:2fr repeat(3,1fr) auto; gap:10px; align-items:end; margin:0 0 14px; } label { display:grid; gap:4px; color:var(--blue-dark); font-size:.72rem; font-weight:800; text-transform:uppercase; letter-spacing:.03em; } input, select { width:100%; min-height:37px; border:1px solid #b9c9d3; border-radius:8px; padding:8px 9px; color:var(--ink); background:#fff; font:inherit; } input:focus, select:focus { outline:0; border-color:var(--blue); box-shadow:0 0 0 3px rgba(7,89,133,.12); }
    .summary { margin:0 0 10px; color:var(--muted); font-size:.84rem; } .table-wrap { overflow:auto; border:1px solid var(--line); border-radius:10px; } table { width:100%; min-width:860px; border-collapse:collapse; } th { padding:9px 10px; color:#fff; background:var(--blue-dark); text-align:left; font-size:.71rem; letter-spacing:.03em; text-transform:uppercase; } td { padding:10px; border-top:1px solid var(--line); vertical-align:top; } tbody tr:hover { background:#f0f9ff; } .muted { color:var(--muted); } .priority { display:inline-block; border-radius:999px; padding:2px 8px; font-size:.74rem; font-weight:800; background:#e2e8f0; } .priority.Alta { color:#9a3412; background:#ffedd5; } .priority.Urgent { color:#991b1b; background:#fee2e2; } .status { display:inline-block; border-radius:999px; padding:2px 8px; color:#166534; background:#dcfce7; font-size:.74rem; font-weight:800; }
    .empty { padding:28px; color:var(--muted); text-align:center; } dialog { width:min(660px,calc(100% - 28px)); border:0; border-radius:14px; box-shadow:0 18px 55px rgba(15,23,42,.28); } dialog::backdrop { background:rgba(15,23,42,.45); } .dialog-head { display:flex; align-items:center; justify-content:space-between; gap:12px; } .dialog-head h3 { margin:0; color:var(--blue-dark); } .close { padding:5px 10px; font-size:1.1rem; } .detail { margin:16px 0 0; display:grid; grid-template-columns:150px 1fr; gap:10px 16px; } .detail dt { color:var(--muted); font-size:.78rem; font-weight:800; } .detail dd { margin:0; white-space:pre-wrap; } footer { padding:0 0 26px; color:var(--muted); text-align:center; font-size:.76rem; }
    @media(max-width:760px) { .header-inner, .auth { align-items:flex-start; } .auth { flex-direction:column; } .filters { grid-template-columns:1fr 1fr; } .filters button { width:100%; } .detail { grid-template-columns:1fr; gap:3px; } }
  </style>
</head>
<body>
  <header><div class="header-inner"><img class="header-logo" src="assets/badalona-basquet-base-logo.png" alt="Badalona Bàsquet Base" /><div><h1>Consulta d'incidències</h1><p class="sub">Pavellons municipals de Badalona</p></div></div></header>
  <main>
    <section id="content" class="panel content">
      <h2>Incidències registrades</h2>
      <p id="authText" class="summary">Carregant incidències…</p>
      <div class="filters">
        <label>Cerca<input id="search" type="search" placeholder="Entitat, contacte o text" /></label>
        <label>Pavelló<select id="venueFilter"><option value="">Tots</option></select></label>
        <label>Tipus<select id="typeFilter"><option value="">Tots</option></select></label>
        <label>Prioritat<select id="priorityFilter"><option value="">Totes</option><option>Urgent</option><option>Alta</option><option>Normal</option><option>Baixa</option></select></label>
        <button id="clearFilters" class="secondary" type="button">Neteja</button>
      </div>
      <p id="summary" class="summary"></p>
      <div id="tableWrap" class="table-wrap"></div>
    </section>
  </main>
  <dialog id="detailDialog"><div class="dialog-head"><h3>Detall de la incidència</h3><button id="closeDetail" class="secondary close" type="button" aria-label="Tancar">×</button></div><dl id="detail" class="detail"></dl></dialog>
  <footer>Badalona Bàsquet Base · Consulta d'incidències</footer>
  <script>
    const DB_URL = 'https://coord-fa09e-default-rtdb.europe-west1.firebasedatabase.app';
    const PATH = 'incidenciesPavellonsBadalona/entries';
    const authText = document.getElementById('authText'), tableWrap = document.getElementById('tableWrap'), summary = document.getElementById('summary'), detailDialog = document.getElementById('detailDialog'), detail = document.getElementById('detail');
    let rows=[];
    const clean = value => String(value || '').trim();
    const escapeHtml = value => clean(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
    const dateTime = value => { const date = new Date(value); return Number.isNaN(date.getTime()) ? '' : date.toLocaleString('ca-ES',{dateStyle:'short',timeStyle:'short'}); };
    function firebaseUrl(){ return DB_URL.replace(/\/$/,'') + '/' + PATH.split('/').map(encodeURIComponent).join('/') + '.json'; }
    async function loadRows(){
      authText.textContent = 'Carregant incidències…';
      try { const response = await fetch(firebaseUrl(), {cache:'no-store'}); if(!response.ok) throw new Error(String(response.status)); const data=await response.json(); rows=Object.entries(data||{}).map(([id,row])=>({id,...(row||{})})).sort((a,b)=>clean(b.createdAt).localeCompare(clean(a.createdAt))); populateFilters(); render(); authText.textContent = rows.length + ' incidència' + (rows.length===1?'':'s') + ' registrada' + (rows.length===1?'':'s') + '.'; }
      catch(error) { authText.textContent = "No s'han pogut carregar les incidències. Torna-ho a provar d'aquí a uns instants."; }
    }
    function optionsFor(id, field){ const select=document.getElementById(id), current=select.value; const values=[...new Set(rows.map(row=>clean(row[field])).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ca')); select.innerHTML='<option value="">Tots</option>'+values.map(value=>'<option>'+escapeHtml(value)+'</option>').join(''); select.value=current; }
    function populateFilters(){ optionsFor('venueFilter','venue'); optionsFor('typeFilter','type'); }
    function filteredRows(){ const search=clean(document.getElementById('search').value).toLocaleLowerCase('ca-ES'), venue=document.getElementById('venueFilter').value, type=document.getElementById('typeFilter').value, priority=document.getElementById('priorityFilter').value; return rows.filter(row=>{ const text=[row.entity,row.contactName,row.email,row.venue,row.type,row.description].map(clean).join(' ').toLocaleLowerCase('ca-ES'); return (!search||text.includes(search)) && (!venue||row.venue===venue) && (!type||row.type===type) && (!priority||row.priority===priority); }); }
    function render(){ const visible=filteredRows(); summary.textContent=visible.length+' de '+rows.length+' incidència'+(rows.length===1?'':'s'); if(!visible.length){ tableWrap.innerHTML='<div class="empty">No hi ha incidències que coincideixin amb els filtres.</div>'; return; } tableWrap.innerHTML='<table><thead><tr><th>Entrada</th><th>Entitat / contacte</th><th>Pavelló</th><th>Tipus</th><th>Prioritat</th><th>Estat</th><th></th></tr></thead><tbody>'+visible.map(row=>'<tr><td>'+escapeHtml(dateTime(row.createdAt))+'</td><td><strong>'+escapeHtml(row.entity)+'</strong><br><span class="muted">'+escapeHtml(row.contactName)+'</span></td><td>'+escapeHtml(row.venue)+'</td><td>'+escapeHtml(row.type)+'</td><td><span class="priority '+escapeHtml(row.priority)+'">'+escapeHtml(row.priority||'Normal')+'</span></td><td><span class="status">'+escapeHtml(row.status||'Pendent')+'</span></td><td><button class="secondary" type="button" data-detail="'+escapeHtml(row.id)+'">Veure</button></td></tr>').join('')+'</tbody></table>'; tableWrap.querySelectorAll('[data-detail]').forEach(button=>button.onclick=()=>openDetail(button.dataset.detail)); }
    function openDetail(id){ const row=rows.find(item=>item.id===id); if(!row) return; const fields=[['Entrada',dateTime(row.createdAt)],['Estat',row.status||'Pendent'],['Entitat',row.entity],['Persona de contacte',row.contactName],['Correu',row.email],['Telèfon',row.phone||'—'],['Pavelló',row.venue],['Tipus',row.type],['Prioritat',row.priority],['Data detectada',row.detectedOn||'—'],['Descripció',row.description]]; detail.innerHTML=fields.map(([key,value])=>'<dt>'+escapeHtml(key)+'</dt><dd>'+escapeHtml(value)+'</dd>').join(''); detailDialog.showModal(); }
    ['search','venueFilter','typeFilter','priorityFilter'].forEach(id=>document.getElementById(id).addEventListener(id==='search'?'input':'change',render)); document.getElementById('clearFilters').onclick=()=>{ ['search','venueFilter','typeFilter','priorityFilter'].forEach(id=>document.getElementById(id).value=''); render(); }; document.getElementById('closeDetail').onclick=()=>detailDialog.close(); detailDialog.addEventListener('click',event=>{ if(event.target===detailDialog) detailDialog.close(); });
    loadRows();
  </script>
</body>
</html>
