<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <title>Calendari de partits · CB Sant Josep</title>
  <style>
    :root {
      --brand: #713f97; --brand-dark: #5a2f7d; --accent: #fcdb20;
      --bg: #f5f3f8; --card: #ffffff; --ink: #2a2233; --muted: #7a7085;
      --line: #e6e0ee; --home: #e8f5e9; --home-ink: #1b5e20; --away: #fff3e0; --away-ink: #7a4a00;
      --shadow: 0 1px 3px rgba(60,40,90,0.08), 0 4px 16px rgba(60,40,90,0.06); --radius: 14px;
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      line-height:1.45; -webkit-font-smoothing:antialiased; }
    header { display:flex; align-items:center; gap:10px; padding:10px 16px;
      background:var(--brand); color:#fff; position:sticky; top:0; z-index:10; box-shadow:var(--shadow); }
    .club-logo { width:38px; height:38px; object-fit:contain; flex-shrink:0; background:#fff; border-radius:9px; padding:3px; }
    .logo-mark { display:inline-grid; place-items:center; width:34px; height:34px; flex-shrink:0; background:#fff; color:var(--brand); border-radius:9px; font-size:1.15rem; font-weight:900; }
    .logo-link { display:inline-flex; cursor:pointer; text-decoration:none; }
    .htext { flex:1; min-width:0; }
    .htext h1 { margin:0; font-size:1rem; font-weight:700; letter-spacing:-0.01em; }
    .htext h1 .club { display:block; font-size:0.72rem; font-weight:500; opacity:0.85; letter-spacing:0.04em; text-transform:uppercase; }
    .htext p { margin:1px 0 0; font-size:0.76rem; opacity:0.9; }
    main { width:100%; max-width:none; margin:0; padding:12px 24px 36px; }
    .nav-panel { display:grid; grid-template-columns:minmax(180px,0.8fr) minmax(220px,1.2fr); gap:6px; margin-bottom:8px; padding:8px;
      background:rgba(255,255,255,0.72); border:1px solid var(--line);
      border-radius:var(--radius); box-shadow:0 1px 2px rgba(60,40,90,0.04); }
    .nav-group { min-width:0; }
    .nav-label { display:block; font-size:0.68rem; text-transform:uppercase; letter-spacing:0.05em;
      color:var(--muted); font-weight:800; margin:0 0 3px; }
    .month-pager, .week-pager { display:grid; grid-template-columns:30px minmax(0,1fr) 30px; gap:5px; align-items:center; }
    .month-current, .week-current { min-height:30px; display:grid; place-items:center; border:1px solid var(--brand);
      border-radius:999px; background:var(--brand); color:#fff; font-size:0.78rem; font-weight:800; padding:3px 8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .week-current { background:var(--card); color:var(--brand-dark); border-color:var(--line); font-size:0.78rem; }
    .nav-arrow { display:inline-grid; place-items:center; width:30px; height:30px; border:1px solid var(--line);
      border-radius:999px; background:var(--card); color:var(--brand); cursor:pointer; }
    .nav-arrow svg { width:16px; height:16px; stroke:currentColor; }
    .nav-arrow:disabled { opacity:0.42; cursor:not-allowed; }
    @media (max-width:640px){ .nav-panel { grid-template-columns:1fr; } }
    .tabs { display:flex; gap:6px; margin-bottom:0; flex-wrap:wrap; }
    .subtabs .tab { font-size:0.78rem; padding:6px 11px; }
    .tab { border:1px solid var(--line); background:var(--card); color:var(--brand);
      padding:7px 13px; border-radius:999px; font-size:0.84rem; font-weight:600; cursor:pointer; transition:all 0.15s; }
    .tab:hover { border-color:var(--brand); }
    .tab.active { background:var(--brand); color:#fff; border-color:var(--brand); }
    .filters { display:flex; align-items:center; flex-wrap:wrap; gap:8px;
      margin-bottom:12px; padding:8px; background:rgba(255,255,255,0.72); border:1px solid var(--line);
      border-radius:var(--radius); box-shadow:0 1px 2px rgba(60,40,90,0.04); }
    .import-status { margin-left:auto; color:var(--muted); font-size:0.7rem; font-weight:700; text-align:right; white-space:nowrap; }
    .filter-group { min-width:0; display:flex; align-items:center; gap:6px; }
    .filter-options { display:flex; gap:5px; flex-wrap:wrap; align-items:center; }
    .category-filter .filter-options { flex-wrap:nowrap; }
    .filters-label { display:block; font-size:0.68rem; text-transform:uppercase; letter-spacing:0.05em;
      color:var(--muted); font-weight:800; margin:0; }
    @media (max-width:820px){ .filters { grid-template-columns:max-content minmax(0,1fr); } .category-filter { grid-column:1 / -1; } }
    @media (max-width:560px){ .filters { grid-template-columns:1fr; } .category-filter { grid-column:auto; } .category-filter .filter-options { flex-wrap:wrap; } }
    .chip { border:1px solid var(--line); background:var(--card); color:var(--ink);
      padding:4px 10px; border-radius:999px; font-size:0.74rem; font-weight:600; cursor:pointer; transition:all 0.15s; }
    .chip:hover { border-color:var(--brand); }
    .chip.active { background:var(--accent); color:#4a3800; border-color:var(--accent); }
    .chip-all.active { background:var(--brand); color:#fff; border-color:var(--brand); }
    .section-title { font-size:1.05rem; font-weight:700; margin:16px 0 2px; color:var(--brand-dark); }
    .section-sub { color:var(--muted); font-size:0.8rem; margin:0 0 8px; }
    .dayblock { margin-bottom:16px; }
    .dayblock-head { display:flex; align-items:center; gap:8px; margin:12px 0 8px;
      padding:6px 10px; background:var(--brand); color:#fff; border-radius:9px;
      font-size:0.9rem; font-weight:700; }
    .dayblock-head .count { margin-left:auto; font-size:0.78rem; font-weight:700;
      background:var(--accent); color:var(--brand-dark); padding:2px 10px; border-radius:20px; }
    .dayblock-date { font-size:0.82rem; font-weight:500; opacity:0.85; }
    .daygroup { margin:0 0 10px; padding-left:8px; border-left:3px solid var(--line); }
    .daygroup:last-child { margin-bottom:0; }
    /* Vista d'agenda setmanal: un dia per columna, com Google Calendar. */
    .calendar-week { display:grid; grid-template-columns:repeat(auto-fit,minmax(0,1fr)); gap:8px; padding-bottom:8px; }
    .agenda-layout { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:14px; align-items:start; }
    .agenda-side { display:flex; flex-direction:column; gap:14px; padding-top:69px; }
    .agenda-layout .changes { margin-top:0; }
    @media (max-width:900px){ .agenda-layout { grid-template-columns:1fr; } .agenda-side { padding-top:0; } }
    .calendar-day { min-height:210px; background:rgba(255,255,255,.7); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
    .calendar-day-head { padding:8px 10px; background:var(--brand); color:#fff; font-size:.78rem; font-weight:800; }
    .calendar-day-date { display:block; opacity:.82; font-size:.68rem; font-weight:600; }
    .calendar-day-games { display:flex; flex-direction:column; gap:6px; padding:7px; }
    .agenda-period { margin:3px 0 0; padding-top:7px; border-top:1px solid var(--line); color:var(--muted); font-size:.64rem; font-weight:900; letter-spacing:.06em; text-transform:uppercase; }
    .agenda-period:first-child { margin-top:0; padding-top:0; border-top:0; }
    .agenda-game { padding:7px; border-left:4px solid var(--brand); border-radius:7px; background:#fff; box-shadow:0 1px 2px rgba(60,40,90,.08); font-size:.74rem; }
    .agenda-game.home { border-left-color:#2e7d32; background:var(--home); }
    .agenda-game.away { border-left-color:#e57d00; background:var(--away); }
    .agenda-time { display:block; color:var(--brand-dark); font-weight:900; }
    .agenda-team { display:block; font-weight:800; }
    .agenda-rival { display:block; color:var(--muted); }
    .agenda-empty { padding:12px 8px; color:var(--muted); font-size:.73rem; font-style:italic; }
    .agenda-legend { display:flex; gap:12px; align-items:center; margin:5px 0 10px; color:var(--muted); font-size:.72rem; font-weight:700; }
    .agenda-legend span { display:inline-flex; align-items:center; gap:5px; }
    .agenda-legend i { width:12px; height:12px; border-radius:3px; border-left:4px solid; background:#fff; }
    .agenda-legend .home { border-color:#2e7d32; background:var(--home); }
    .agenda-legend .away { border-color:#e57d00; background:var(--away); }

    .daygroup-head { font-size:0.68rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); font-weight:700; margin:0 0 6px; }
    .slotgroup { margin:0 0 8px; }
    .slotgroup:last-child { margin-bottom:0; }
    /* Fora: blocs de franja en fila, d'esquerra a dreta per hora */
    .slotrow { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-start; }
    .slotrow > .slotgroup { margin:0; flex:0 1 auto; }
    .slotrow .games { grid-template-columns:1fr; }
    .slot-head { display:inline-block; font-size:0.82rem; font-weight:700; color:var(--brand-dark);
      background:var(--accent); padding:2px 8px; border-radius:6px; margin:0 0 6px; }
    .games { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:8px; }
    .game { background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
      box-shadow:var(--shadow); padding:8px 10px; display:flex; flex-direction:column; gap:4px; }
    .game-top { display:flex; align-items:center; gap:6px; }
    .game-time { font-weight:700; font-size:0.84rem; color:var(--brand-dark); }
    .badge { font-size:0.62rem; font-weight:700; padding:2px 6px; border-radius:6px; text-transform:uppercase; letter-spacing:0.03em; }
    .badge.home { background:var(--home); color:var(--home-ink); }
    .badge.away { background:var(--away); color:var(--away-ink); }
    .badge.day { background:#ede7f6; color:#4527a0; }
    .friendly, .mini-mark, .change-mark, .conflict-mark { cursor:help; font-size:0.9em; }
    .change-mark { display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px;
      margin-left:4px; border-radius:50%; background:var(--accent); color:var(--brand-dark); font-weight:900; }
    .conflict-mark { display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px;
      margin-left:4px; border-radius:50%; background:#c62828; color:#fff; font-weight:900; }
    /* Gènere identificat només per color (vora + fons suau) */
    .game.masc, .gchip.masc { border-left:5px solid #1565c0; border-right:5px solid #1565c0; background:#f2f8fe; }
    .game.fem, .gchip.fem { border-left:5px solid #c2185b; border-right:5px solid #c2185b; background:#fdf3f7; }
    /* Chips de filtre de gènere: mateix codi de color */
    .chip.sex-masc.active { background:#1565c0; color:#fff; border-color:#1565c0; }
    .chip.sex-fem.active { background:#c2185b; color:#fff; border-color:#c2185b; }
    .chip.sex-masc { border-color:#1565c0; color:#1565c0; }
    .chip.sex-fem { border-color:#c2185b; color:#c2185b; }
    .chip.friendly-filter { border-color:var(--brand); color:var(--brand); }
    .chip.friendly-filter.active { background:var(--brand); color:#fff; border-color:var(--brand); }
    .legend { display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; margin:6px 0 12px;
      color:var(--muted); font-size:0.72rem; font-weight:600; }
    .legend-item { display:inline-flex; align-items:center; gap:5px; }
    .legend .friendly, .legend .mini-mark, .legend .change-mark, .legend .conflict-mark { margin-left:0; }
    /* Graella de casa: 3 columnes iguals (les 3 hores de la franja) */
    .hgrid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:6px;
      align-items:start; margin:0 0 8px; }
    .hgrid3:last-child { margin-bottom:0; }
    .hslot { display:flex; flex-direction:column; gap:6px; }
    .hgrid-th { font-size:0.82rem; font-weight:700; color:var(--brand-dark);
      background:var(--accent); padding:3px 8px; border-radius:6px; text-align:center; }
    .hcell { display:flex; flex-direction:column; gap:6px; }
    .hcell.empty { }
    .gchip { background:var(--card); border:1px solid var(--line); border-radius:10px;
      box-shadow:var(--shadow); padding:6px 8px; display:flex; flex-direction:column; gap:3px; }
    .gchip-top { display:flex; align-items:center; gap:5px; }
    .gchip-team { font-weight:700; font-size:0.82rem; }
    .gchip-vs { font-size:0.76rem; color:var(--muted); }
    .gchip-vs .lbl { color:var(--brand); font-weight:600; }
    .gchip-loc { font-size:0.7rem; color:var(--muted); }
    @media (max-width:520px){ .hgrid3 { grid-template-columns:1fr; } .hgrid3 .hgrid-th { text-align:left; } }
    .game-team { font-weight:700; font-size:0.86rem; }
    .game-vs { font-size:0.8rem; color:var(--ink); }
    .game-vs .lbl { color:var(--muted); font-size:0.72rem; }
    .game-loc { font-size:0.7rem; color:var(--muted); display:flex; align-items:center; gap:4px; }
    .game-cost, .gchip-cost { font-size:0.76rem; color:var(--brand-dark); font-weight:800; }
    .changes { margin-top:30px; padding:16px; background:var(--card); border:1px solid var(--line);
      border-radius:var(--radius); box-shadow:var(--shadow); }
    .changes.conflicts { margin-top:0; border-left:4px solid #c62828; }
    .changes h3 { margin:0 0 4px; color:var(--brand-dark); font-size:1.05rem; }
    .changes-meta { margin:0 0 12px; color:var(--muted); font-size:0.78rem; }
    .changes-list + .changes-meta { margin:10px 0 0; }
    .changes-head { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
    .changes-nav { display:grid; grid-template-columns:auto minmax(70px,1fr) auto; gap:8px; align-items:center; margin-top:12px; }
    .changes-nav button { display:inline-grid; place-items:center; width:32px; height:32px; min-width:0; padding:0;
      border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--brand); cursor:pointer; }
    .changes-nav button:disabled { opacity:0.42; cursor:not-allowed; }
    .changes-nav svg { width:17px; height:17px; stroke:currentColor; }
    .changes-position { color:var(--muted); font-size:0.74rem; font-weight:800; text-align:center; }
    .changes-list { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
    .change-item { border-left:4px solid var(--brand); padding-left:10px; }
    .change-item.added { border-left-color:#2e7d32; }
    .change-item.removed { border-left-color:#c62828; }
    .change-item.conflict { border-left-color:#c62828; }
    .change-kind { font-size:0.7rem; font-weight:800; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); }
    .change-main { font-weight:700; font-size:0.9rem; }
    .change-detail { color:var(--muted); font-size:0.8rem; }
    .empty-filter { color:var(--muted); font-style:italic; text-align:center; padding:40px 0; }
    footer { text-align:center; color:var(--muted); font-size:0.75rem; padding:20px; }
    @media (max-width:520px){ .games { grid-template-columns:1fr; } }
      .page-nav { margin:0 0 16px; }
    .back { color:var(--brand); font-weight:800; text-decoration:none; font-size:0.86rem; }
  </style>
</head>

  <script>
    let DATA = JSON.parse(document.getElementById('partitsData').textContent);
    const FIREBASE_DB_URL = "https://coord-fa09e-default-rtdb.europe-west1.firebasedatabase.app";
    const CALENDAR_FIREBASE_PATH = "calendarGames/season-26-27";
    const content = document.getElementById('content');
    const CHANGES_PER_PAGE = 3;
    let changesPage = 0;
    const MONTHS = ['gener','febrer','març','abril','maig','juny','juliol','agost','setembre','octubre','novembre','desembre'];
    function fmtDate(iso){
      const p=iso.split('-').map(Number);
      return p[2]+' '+MONTHS[p[1]-1];
    }
    function fmtDateNumeric(iso){
      const p=iso.split('-').map(Number);
      return String(p[2]).padStart(2,'0') + '/' + String(p[1]).padStart(2,'0') + '/' + p[0];
    }
    function fmtChangeValue(label,value){
      return label === 'Data' && /^\d{4}-\d{2}-\d{2}$/.test(value) ? fmtDateNumeric(value) : value;
    }
    function fmtImportDate(value){
      const date = value ? new Date(value) : null;
      if (!date || Number.isNaN(date.getTime())) return '';
      return date.toLocaleDateString('ca-ES') + ' a les ' + date.toLocaleTimeString('ca-ES', { hour:'2-digit', minute:'2-digit' });
    }
    function addDays(iso,n){ const p=iso.split('-').map(Number); const dt=new Date(Date.UTC(p[0],p[1]-1,p[2]+n)); return dt.toISOString().slice(0,10); }
    function fullWeekLabel(monday){ return fmtDate(monday)+' – '+fmtDate(addDays(monday,6)); }
    function compactWeekLabel(monday){
      const start=fmtDateNumeric(monday).slice(0,5);
      const end=fmtDateNumeric(addDays(monday,6)).slice(0,5);
      return start+' – '+end;
    }

    const FAMILY_ORDER=['SÈNIOR','JÚNIOR','CADET','INFANTIL','MINI'];
    const SEX_ORDER=[['M','Masculí'],['F','Femení']];
    const activeFilters=new Set(); // categories
    const activeSex=new Set();     // gèneres
    let activeFriendly=false;      // només amistosos
    let showAway=false;            // per defecte, només partits a casa
    function passes(g){
      const okFam = activeFilters.size===0 || activeFilters.has(g.fam);
      const okSex = activeSex.size===0 || activeSex.has(g.sex);
      const okFriendly = !activeFriendly || !!g.friendly;
      const okVenue = g.home || showAway;
      return okFam && okSex && okFriendly && okVenue;
    }

    function changedGameKey(g){
      return [g.date,g.time,g.team,g.sex,g.rival,g.loc||'',g.home?'home':'away',g.friendly?'friendly':''].join('|');
    }

    const changedGames=new Set();
    function rebuildChangedGames(){
      changedGames.clear();
      if(DATA.latestChanges && DATA.latestChanges.changes){
        DATA.latestChanges.changes.forEach(function(c){
        if(c.type==='removed' || !c.game) return;
        changedGames.add(changedGameKey(c.game));
        });
      }
    }
    rebuildChangedGames();

    function firebaseDataUrl(path){
      const base = FIREBASE_DB_URL.replace(/\/$/, "");
      return base + "/" + path.split("/").map(encodeURIComponent).join("/") + ".json";
    }

    async function loadRemoteCalendarData(){
      try{
        const response = await fetch(firebaseDataUrl(CALENDAR_FIREBASE_PATH), { cache:"no-store" });
        if(!response.ok) return;
        const remote = await response.json();
        if(remote && Array.isArray(remote.weeks) && remote.weeks.length){
          DATA = remote;
        }
      }catch(err){
        console.warn("No s'han pogut carregar els calendaris de Firebase; s'utilitzen les dades incrustades.", err);
      }
    }

    function changeMark(g){
      return changedGames.has(changedGameKey(g))
        ? ' <span class="change-mark" title="Partit amb canvis recents">↻</span>'
        : '';
    }

    function canonicalPlace(loc){
      const raw=String(loc||'').trim();
      if(!raw) return '';
      const normalized=raw.normalize('NFD').replace(/[\u0300-\u036f]/g,'')
        .replace(/\s+/g,' ').toUpperCase();
      if(/LA COLINA|GRAN BRETANYA/.test(normalized)) return 'PAVELLO LA COLINA';
      if(/MONTIGALA/.test(normalized)) return 'PAVELLO DE MONTIGALA';
      if(/BUFALA/.test(normalized)) return 'BUFALA';
      if(/POMAR/.test(normalized)) return 'POLIESPORTIU DE POMAR';
      if(/AUSIAS MARCH/.test(normalized)) return 'PAVELLO AUSIAS MARCH';
      if(/ENRIC BORRAS/.test(normalized)) return 'PISTA ENRIC BORRAS';
      if(/LA GABIA/.test(normalized)) return 'PISTA LA GABIA';
      return normalized;
    }

    function placeTimeKey(g){
      const place=canonicalPlace(g.loc);
      return place ? [g.date,g.time,place].join('|') : '';
    }

    const conflictKeys=new Set();
    const gamesByPlaceTime=new Map();
    function rebuildConflicts(){
      conflictKeys.clear(); gamesByPlaceTime.clear();
      DATA.weeks.forEach(function(wk){ wk.games.forEach(function(g){
        const key=placeTimeKey(g); if(!key) return;
        if(!gamesByPlaceTime.has(key)) gamesByPlaceTime.set(key,[]);
        gamesByPlaceTime.get(key).push(g);
      }); });
      gamesByPlaceTime.forEach(function(games,key){ if(games.length>1 && !isAllowedMiniSaturdayAfternoon(games)) conflictKeys.add(key); });
    }
    rebuildConflicts();

    function isAllowedMiniSaturdayAfternoon(games){
      return games.length<=3 && games.every(function(g){
        const smallBasket=g.fam==='MINI';
        const saturdayAfternoon=g.dow===6 && g.time==='16:00';
        const sundayMorning=g.dow===0 && g.time==='09:00';
        return smallBasket && (saturdayAfternoon || sundayMorning);
      });
    }

    function conflictMark(g){
      const key=placeTimeKey(g);
      return key && conflictKeys.has(key)
        ? ' <span class="conflict-mark" title="Possible conflicte: mateix dia, hora i lloc">!</span>'
        : '';
    }

    function renderConflicts(){
      const conflicts=[];
      gamesByPlaceTime.forEach(function(games,key){
        if(games.length<=1) return;
        if(isAllowedMiniSaturdayAfternoon(games)) return;
        conflicts.push({key,games});
      });
      if(!conflicts.length) return '';
      conflicts.sort(function(a,b){ return a.key.localeCompare(b.key); });
      const items=conflicts.map(function(c){
        const first=c.games[0];
        const loc=shortLocation(first.loc) || 'Sense lloc';
        const teams=c.games.map(function(g){
          return '<div class="change-detail">' + g.team + ' ' + (g.sex==='F'?'F':'M') + ' vs ' + g.rival + '</div>';
        }).join('');
        return '<li class="change-item conflict"><div class="change-kind">Conflicte</div>' +
          '<div class="change-main">' + fmtDateNumeric(first.date) + ' ' + first.time + ' · ' + loc + '</div>' + teams + '</li>';
      }).join('');
      return '<section class="changes conflicts"><h3>Conflictes</h3>' +
        '<p class="changes-meta">Partits amb el mateix dia, hora i lloc.</p>' +
        '<ul class="changes-list">' + items + '</ul></section>';
    }

    function iconLegend(){
      const importStatus = renderImportStatus();
      return '<div class="legend" aria-label="Llegenda d&apos;icones">' +
        '<span class="legend-item"><span class="friendly" title="Partit amistós">🤝</span> Amistós</span>' +
        '<span class="legend-item"><span class="mini-mark" title="Partit de Mini">🍼</span> Mini</span>' +
        '<span class="legend-item"><span class="change-mark" title="Partit amb canvis recents">↻</span> Canvi recent</span>' +
        '<span class="legend-item"><span class="conflict-mark" title="Possible conflicte: mateix horari i pista">!</span> Mateixa hora i pista</span>' +
        importStatus +
        '</div>';
    }
    function renderImportStatus(){
      const checkedAt = fmtImportDate(DATA.latestChanges && (DATA.latestChanges.checkedAt || DATA.latestChanges.importedAt));
      return checkedAt ? '<div class="import-status">Calendari comprovat: ' + checkedAt + '</div>' : '';
    }

    function miniMark(g){
      return g.fam === 'MINI'
        ? ' <span class="mini-mark" title="Partit de Mini">🍼</span>'
        : '';
    }

    function gameCard(g){
      const sexCls = g.sex==='F' ? 'fem' : 'masc';
      const vs = g.home
        ? '<div class="game-vs"><span class="lbl">vs</span> ' + g.rival + '</div>'
        : '<div class="game-vs"><span class="lbl">l\'equip rival és</span> ' + g.rival + '</div>';
      const showLoc = !!g.loc;
      const loc = showLoc ? '<div class="game-loc">📍 ' + shortLocation(g.loc) + '</div>' : '';
      const cost = g.cost != null ? '<div class="game-cost">Cost: ' + formatCost(g.cost) + '</div>' : '';
      // Partit amistós: icona 🤝 amb tooltip.
      const fr = g.friendly ? ' <span class="friendly" title="Partit amistós">🤝</span>' : '';
      const mini = miniMark(g);
      const ch = changeMark(g);
      const cf = conflictMark(g);
      // El gènere s'identifica pel color de la targeta (masc/fem), sense text.
      return '<div class="game ' + sexCls + '"><div class="game-team">' + g.team + fr + mini + ch + cf + '</div>' +
        vs + loc + cost + '</div>';
    }

    function shortLocation(loc){
      if(!loc) return 'Pista';
      const text=String(loc).trim().replace(/\s+/g,' ');
      const normalized=text.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
      if(/LA COLINA|GRAN BRETANYA/.test(normalized)) return 'La Colina';
      if(/MONTIGALA/.test(normalized)) return 'Montigalà';
      if(/BUFALA/.test(normalized)) return 'Bufalà';
      if(/POMAR/.test(normalized)) return 'Pomar';
      if(/AUSIAS MARCH/.test(normalized)) return 'Ausiàs March';
      if(/ENRIC BORRAS/.test(normalized)) return 'Enric Borràs';
      if(/LA GABIA/.test(normalized)) return 'La Gàbia';
      if(/SERRALLO/.test(normalized)) return 'Pavelló del Serrallo';
      if(/VIRREI AMAT/.test(normalized)) return 'Virrei Amat';
      if(/AGNES GREGORI/.test(normalized)) return 'Pavelló Agnès Gregori';
      if(/LA BORDETA/.test(normalized)) return 'Centre Esportiu La Bordeta';
      if(/JOSEP MORA/.test(normalized)) return 'Palau Josep Mora';
      if(/PAVELLO ALMEDA/.test(normalized)) return 'Pavelló Almeda';
      if(/EUSEBI MILLAN/.test(normalized)) return 'Poliesportiu Eusebi Millan';
      if(/MUNICIPAL SANT CUGAT/.test(normalized)) return 'Pavelló Municipal Sant Cugat';
      if(/ARGENTONA/.test(normalized)) return "Pavelló d'Argentona";
      return text.split(',')[0].trim();
    }

    // Nom curt de pavelló per a les capçaleres de fila de la graella de casa.
    function venueName(loc){
      return shortLocation(loc);
    }

    // Targeta compacta per a les cel·les de la graella de casa.
    function gameChip(g){
      const sexCls = g.sex==='F' ? 'fem' : 'masc';
      const showLoc = !!g.loc;
      const loc = showLoc ? '<div class="gchip-loc">📍 ' + venueName(g.loc) + '</div>' : '';
      const cost = g.cost != null ? '<div class="gchip-cost">Cost: ' + formatCost(g.cost) + '</div>' : '';
      // Partit amistós: icona 🤝 amb tooltip.
      const fr = g.friendly ? ' <span class="friendly" title="Partit amistós">🤝</span>' : '';
      const mini = miniMark(g);
      const ch = changeMark(g);
      const cf = conflictMark(g);
      // El gènere s'identifica pel color de la targeta (masc/fem), sense text.
      return '<div class="gchip ' + sexCls + '"><div class="gchip-top">' +
        '<span class="gchip-team">' + g.team + fr + mini + ch + cf + '</span></div>' +
        '<div class="gchip-vs"><span class="lbl">vs</span> ' + g.rival + '</div>' + loc + cost + '</div>';
    }

    function formatCost(value){
      return Number(value).toLocaleString('ca-ES', { maximumFractionDigits: 2 }) + '€';
    }

    // Graella horitzontal per a un dia de casa: files=pavelló, columnes=franja.
    // Franges fixes de casa: bloc de matí i bloc de tarda.
    const HOME_MORNING=['09:00','10:45','12:30'];
    const HOME_AFTERNOON=['16:00','17:45','19:30'];

    // Un bloc (matí o tarda): 3 columnes iguals per a les 3 hores fixes.
    // Cada cel·la apila els partits d'aquella hora (2n partit = 2a fila).
    function homeBlock(gs, cols){
      const bySlot={};
      gs.forEach(function(g){ (bySlot[g.time]=bySlot[g.time]||[]).push(g); });
      let h='<div class="hgrid3">';
      cols.forEach(function(t){
        const list=bySlot[t]||[];
        h += '<div class="hslot"><div class="hgrid-th">' + t + '</div>' +
          '<div class="hcell' + (list.length?'':' empty') + '">' +
          list.map(gameChip).join('') + '</div></div>';
      });
      h += '</div>';
      return h;
    }

    function homeGrid(gs){
      const morning=gs.filter(function(g){ return HOME_MORNING.indexOf(g.time)>=0; });
      const afternoon=gs.filter(function(g){ return HOME_AFTERNOON.indexOf(g.time)>=0; });
      const other=gs.filter(function(g){
        return HOME_MORNING.indexOf(g.time)<0 && HOME_AFTERNOON.indexOf(g.time)<0;
      });
      let h='';
      if(morning.length) h += homeBlock(morning, HOME_MORNING);
      if(afternoon.length) h += homeBlock(afternoon, HOME_AFTERNOON);
      // Hores fora d'horari estàndard: bloc propi amb les seves columnes.
      if(other.length){
        const cols=[]; other.forEach(function(g){ if(cols.indexOf(g.time)<0) cols.push(g.time); });
        cols.sort();
        h += homeBlock(other, cols);
      }
      return h;
    }

    function renderWeek(wk){
      const days=[{dow:1,name:'Dilluns',off:0},{dow:2,name:'Dimarts',off:1},{dow:3,name:'Dimecres',off:2},{dow:4,name:'Dijous',off:3},{dow:5,name:'Divendres',off:4},{dow:6,name:'Dissabte',off:5},{dow:0,name:'Diumenge',off:6}];
      const all=wk.games.filter(passes); if(!all.length) return '';
      let html='<div class="section-title">Setmana ' + fullWeekLabel(wk.monday) + '</div><p class="section-sub">Agenda setmanal · ' + all.length + ' partits</p><div class="calendar-week">';
      days.forEach(function(d){
        const gs=all.filter(function(g){return g.dow===d.dow;}).sort(function(a,b){return a.time.localeCompare(b.time);});
        if(!gs.length) return;
        html+='<section class="calendar-day"><div class="calendar-day-head">'+d.name+'<span class="calendar-day-date">'+fmtDate(addDays(wk.monday,d.off))+'</span></div><div class="calendar-day-games">';
        const morning=gs.filter(function(g){return g.time<'14:00';}), afternoon=gs.filter(function(g){return g.time>='14:00';});
        function cards(list){return list.map(function(g){
          const fr=g.friendly?' <span class="friendly" title="Partit amistós">🤝</span>':'';
          const mini=miniMark(g), ch=changeMark(g), cf=conflictMark(g);
          const loc=g.loc?'<span class="agenda-rival">📍 '+shortLocation(g.loc)+'</span>':'';
          return '<div class="agenda-game '+(g.home?'home':'away')+'"><span class="agenda-time">'+g.time+'</span><span class="agenda-team">'+g.team+fr+mini+ch+cf+'</span><span class="agenda-rival">vs '+g.rival+'</span>'+loc+'</div>';
        }).join('');}
        html+=(morning.length?'<div class="agenda-period">Matí</div>'+cards(morning):'')+(afternoon.length?'<div class="agenda-period">Tarda</div>'+cards(afternoon):'');
        html+='</div></section>';
      });
      return html+'</div>';
    }

    function changeTypeLabel(t){
      if(t==='added') return 'Afegit';
      if(t==='removed') return 'Eliminat';
      return 'Canviat';
    }

    function changeGameLine(g){
      const sex=g.sex==='F'?'F':'M';
      const where=g.home?'casa':'fora';
      const loc=g.loc ? ' · ' + shortLocation(g.loc) : '';
      const fr=g.friendly ? ' · amistós' : '';
      return fmtDateNumeric(g.date) + ' ' + g.time + ' · ' + g.team + ' ' + sex + ' vs ' + g.rival + ' · ' + where + loc + fr;
    }

    function changeIcon(name){
      if(name === 'prev'){
        return '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
          '<path d="M15 18l-6-6 6-6"></path></svg>';
      }
      return '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '<path d="M9 18l6-6-6-6"></path></svg>';
    }

    function moveChanges(delta){
      const changes=orderedLatestChanges(DATA.latestChanges);
      const maxPage=Math.max(0, Math.ceil(changes.length / CHANGES_PER_PAGE) - 1);
      changesPage=Math.max(0, Math.min(maxPage, changesPage + delta));
      renderContent();
    }

    function bindChangesNav(){
      const prev=document.getElementById('changesPrev');
      const next=document.getElementById('changesNext');
      if(prev) prev.onclick=function(){ moveChanges(-1); };
      if(next) next.onclick=function(){ moveChanges(1); };
    }

    function changeImportDate(change, fallback){
      return change && change.importedAt ? change.importedAt : (fallback || '');
    }

    function orderedLatestChanges(latest){
      const changes=(latest && latest.changes) || [];
      const fallback=latest && latest.importedAt;
      return changes.map(function(change,index){
        return {change:change,index:index};
      }).sort(function(a,b){
        const ai=changeImportDate(a.change, fallback);
        const bi=changeImportDate(b.change, fallback);
        if(ai !== bi) return ai < bi ? 1 : -1;
        return a.index - b.index;
      }).map(function(item){
        return item.change;
      });
    }

    function renderLatestChanges(){
      const latest=DATA.latestChanges;
      if(!latest || !latest.changes || !latest.changes.length) return '';
      const changes=orderedLatestChanges(latest);
      const total=changes.length;
      const pages=Math.max(1, Math.ceil(total / CHANGES_PER_PAGE));
      changesPage=Math.max(0, Math.min(changesPage, pages - 1));
      const start=changesPage * CHANGES_PER_PAGE;
      const visible=changes.slice(start, start + CHANGES_PER_PAGE);
      const items=visible.map(function(c){
        const details=(c.fields||[]).map(function(f){
          return '<div class="change-detail">' + f.label + ': ' +
            fmtChangeValue(f.label, f.from) + ' → ' + fmtChangeValue(f.label, f.to) + '</div>';
        }).join('');
        return '<li class="change-item ' + c.type + '"><div class="change-kind">' + changeTypeLabel(c.type) + '</div>' +
          '<div class="change-main">' + changeGameLine(c.game) + '</div>' + details + '</li>';
      }).join('');
      const nav=total > CHANGES_PER_PAGE
        ? '<div class="changes-nav">' +
          '<button type="button" id="changesPrev" title="Endarrere" aria-label="Endarrere" ' + (changesPage===0 ? 'disabled' : '') + '>' + changeIcon('prev') + '</button>' +
          '<div class="changes-position">Canvis ' + (start + 1) + '-' + Math.min(start + CHANGES_PER_PAGE, total) + ' de ' + total + '</div>' +
          '<button type="button" id="changesNext" title="Endavant" aria-label="Endavant" ' + (changesPage>=pages-1 ? 'disabled' : '') + '>' + changeIcon('next') + '</button>' +
          '</div>'
        : '';
      return '<section class="changes"><div class="changes-head"><div><h3>Últims canvis (' + total + ')</h3></div></div>' +
        '<ul class="changes-list">' + items + '</ul>' + nav + '</section>';
    }

    const currentMonthLabelEl = document.getElementById('currentMonthLabel');
    const prevMonthEl = document.getElementById('prevMonth');
    const nextMonthEl = document.getElementById('nextMonth');
    const currentWeekLabelEl = document.getElementById('currentWeekLabel');
    const prevWeekEl = document.getElementById('prevWeek');
    const nextWeekEl = document.getElementById('nextWeek');

    // Assigna cada setmana a un mes segons el dissabte (primer dia visible de competició)
    function monthKeyOf(wk){ const sat=addDays(wk.monday,5); return sat.slice(0,7); } // "YYYY-MM"
    function monthLabel(key){ const p=key.split('-').map(Number); const n=MONTHS[p[1]-1]; return n.charAt(0).toUpperCase()+n.slice(1)+' '+p[0]; }

    // Ordre de mesos i setmanes de cada mes
    let monthKeys=[];
    let weeksByMonth={};
    function rebuildMonths(){
      monthKeys=[];
      weeksByMonth={};
      DATA.weeks.forEach(function(wk,i){
        const k=monthKeyOf(wk);
        if(!(k in weeksByMonth)){ weeksByMonth[k]=[]; monthKeys.push(k); }
        weeksByMonth[k].push(i); // guarda índex global de la setmana
      });
    }
    rebuildMonths();

    let currentMonth=0;   // índex dins monthKeys
    let currentIdx=0;     // índex global de setmana dins DATA.weeks

    function renderContent(){
      const html=renderWeek(DATA.weeks[currentIdx]);
      const weekHtml = html.trim() ? html : '<p class="empty-filter">Cap partit per als filtres seleccionats.</p>';
      const conflicts=renderConflicts();
      const venueLegend='<div class="agenda-legend"><span><i class="home"></i>Casa</span><span><i class="away"></i>Fora</span></div>';
      content.innerHTML = '<div class="agenda-layout"><div>' + weekHtml + venueLegend + iconLegend() + '</div><aside class="agenda-side">' + conflicts + renderLatestChanges() + '</aside></div>';
      bindChangesNav();
    }

    // Dibuixa les setmanes del mes actiu i selecciona-ne una
    function buildWeekTabs(weekIdx){
      const key=monthKeys[currentMonth];
      const idxs=weeksByMonth[key];
      // setmana a seleccionar: la demanada si és del mes, si no la primera del mes
      const target = (weekIdx!=null && idxs.indexOf(weekIdx)>=0) ? weekIdx : idxs[0];
      showWeek(target);
    }

    function showWeek(gi){
      currentIdx=gi; renderContent();
      const idxs=weeksByMonth[monthKeys[currentMonth]];
      const pos=idxs.indexOf(gi);
      currentWeekLabelEl.textContent=compactWeekLabel(DATA.weeks[gi].monday);
      currentWeekLabelEl.title=fullWeekLabel(DATA.weeks[gi].monday);
      prevWeekEl.disabled=pos<=0;
      nextWeekEl.disabled=pos<0 || pos>=idxs.length-1;
      window.scrollTo({top:0,behavior:'smooth'});
    }

    function showMonth(mi, weekIdx){
      currentMonth=mi;
      currentMonthLabelEl.textContent=monthLabel(monthKeys[mi]);
      prevMonthEl.disabled=mi<=0;
      nextMonthEl.disabled=mi>=monthKeys.length-1;
      buildWeekTabs(weekIdx);
    }

    prevMonthEl.innerHTML=changeIcon('prev');
    nextMonthEl.innerHTML=changeIcon('next');
    prevWeekEl.innerHTML=changeIcon('prev');
    nextWeekEl.innerHTML=changeIcon('next');
    prevMonthEl.onclick=function(){ if(currentMonth>0) showMonth(currentMonth-1,null); };
    nextMonthEl.onclick=function(){ if(currentMonth<monthKeys.length-1) showMonth(currentMonth+1,null); };
    prevWeekEl.onclick=function(){
      const idxs=weeksByMonth[monthKeys[currentMonth]];
      const pos=idxs.indexOf(currentIdx);
      if(pos>0) showWeek(idxs[pos-1]);
    };
    nextWeekEl.onclick=function(){
      const idxs=weeksByMonth[monthKeys[currentMonth]];
      const pos=idxs.indexOf(currentIdx);
      if(pos>=0 && pos<idxs.length-1) showWeek(idxs[pos+1]);
    };

    function buildFilters(){
      const presentFam=new Set(), presentSex=new Set();
      DATA.weeks.forEach(function(wk){ wk.games.forEach(function(g){ presentFam.add(g.fam); presentSex.add(g.sex); }); });
      const fams=FAMILY_ORDER.filter(function(f){ return presentFam.has(f); });
      const sexes=SEX_ORDER.filter(function(s){ return presentSex.has(s[0]); });
      const el=document.getElementById('filters');
      el.innerHTML='';
      function group(label, className){
        const wrap=document.createElement('div');
        wrap.className='filter-group' + (className ? ' ' + className : '');
        const l=document.createElement('span');
        l.className='filters-label';
        l.textContent=label;
        const opts=document.createElement('div');
        opts.className='filter-options';
        wrap.appendChild(l);
        wrap.appendChild(opts);
        el.appendChild(wrap);
        return opts;
      }

      // Grup 1: tipus
      const typeGroup=group('Tipus', 'type-filter');
      if(sexes.length>1){
        const allS=document.createElement('button'); allS.className='chip chip-all sex-all active'; allS.textContent='Tots';
        allS.onclick=function(){ activeSex.clear(); sync(); renderContent(); }; typeGroup.appendChild(allS);
        sexes.forEach(function(s){
          const b=document.createElement('button');
          b.className='chip ' + (s[0]==='F' ? 'sex-fem' : 'sex-masc');
          b.textContent=s[1]; b.dataset.sex=s[0];
          b.onclick=function(){ if(activeSex.has(s[0])) activeSex.delete(s[0]); else activeSex.add(s[0]); sync(); renderContent(); };
          typeGroup.appendChild(b);
        });
      }

      const friendly=document.createElement('button');
      friendly.className='chip friendly-filter';
      friendly.textContent='Amistós';
      friendly.onclick=function(){ activeFriendly=!activeFriendly; sync(); renderContent(); };
      typeGroup.appendChild(friendly);

      // Grup 2: ubicació
      const venueGroup=group('Partits', 'venue-filter');
      const away=document.createElement('button');
      away.className='chip away-filter';
      away.textContent='Mostrar fora';
      away.onclick=function(){ showAway=!showAway; sync(); renderContent(); };
      venueGroup.appendChild(away);

      // Grup 3: categoria
      const famGroup=group('Categoria', 'category-filter');
      const allF=document.createElement('button'); allF.className='chip chip-all fam-all active'; allF.textContent='Totes';
      allF.onclick=function(){ activeFilters.clear(); sync(); renderContent(); }; famGroup.appendChild(allF);
      fams.forEach(function(f){
        const b=document.createElement('button'); b.className='chip'; b.textContent=f; b.dataset.fam=f;
        b.onclick=function(){ if(activeFilters.has(f)) activeFilters.delete(f); else activeFilters.add(f); sync(); renderContent(); };
        famGroup.appendChild(b);
      });

      function sync(){
        const sexAll=el.querySelector('.sex-all');
        if(sexAll) sexAll.classList.toggle('active',activeSex.size===0);
        el.querySelector('.fam-all').classList.toggle('active',activeFilters.size===0);
        Array.prototype.forEach.call(el.querySelectorAll('.chip[data-sex]'), function(c){ c.classList.toggle('active',activeSex.has(c.dataset.sex)); });
        const friendly=el.querySelector('.friendly-filter');
        if(friendly) friendly.classList.toggle('active',activeFriendly);
        const away=el.querySelector('.away-filter');
        if(away) away.classList.toggle('active',showAway);
        Array.prototype.forEach.call(el.querySelectorAll('.chip[data-fam]'), function(c){ c.classList.toggle('active',activeFilters.has(c.dataset.fam)); });
      }
    }
    function defaultWeek(){
      const now=new Date();
      const today=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
      for(let i=0;i<DATA.weeks.length;i++){
        const mon=DATA.weeks[i].monday, sun=addDays(mon,6);
        if(today>=mon && today<=sun) return i;
      }
      for(let i=0;i<DATA.weeks.length;i++){ if(DATA.weeks[i].monday>today) return i; }
      return DATA.weeks.length-1;
    }
    async function init(){
      await loadRemoteCalendarData();
      rebuildChangedGames();
      rebuildConflicts();
      rebuildMonths();
      buildFilters();
      // Obre el mes i la setmana on estiguem (o el/la m\u00e9s proper/a)
      const startIdx=defaultWeek();
      const startKey=monthKeyOf(DATA.weeks[startIdx]);
      showMonth(monthKeys.indexOf(startKey), startIdx);
    }
    init();
  </script>
</body>
</html>
