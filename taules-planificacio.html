<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <title>Planificació Taules · CB Sant Josep</title>
  <style>
    :root {
      --brand:#713f97; --brand-dark:#5a2f7d; --accent:#fcdb20;
      --bg:#f5f3f8; --card:#ffffff; --ink:#2a2233; --muted:#7a7085;
      --line:#e6e0ee; --ok:#1f9d63; --warn:#d97706; --danger:#d64545;
      --shadow:0 1px 3px rgba(60,40,90,0.08),0 4px 16px rgba(60,40,90,0.06);
      --radius:16px;
    }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      line-height:1.45; -webkit-font-smoothing:antialiased; }
    header { display:flex; align-items:center; gap:14px; padding:16px 20px;
      background:var(--brand); color:#fff; box-shadow:var(--shadow); }
    .club-logo { width:48px; height:48px; object-fit:contain; flex-shrink:0; background:#fff; border-radius:10px; padding:3px; }
    .logo-mark { display:inline-grid; place-items:center; width:40px; height:40px; flex-shrink:0; background:#fff; color:var(--brand); border-radius:9px; font-size:1.35rem; font-weight:900; }
    .htext { flex:1; min-width:0; }
    .htext h1 { margin:0; font-size:1.05rem; font-weight:700; }
    .htext h1 .club { display:block; font-size:0.72rem; font-weight:500; opacity:0.85; letter-spacing:0.04em; text-transform:uppercase; }
    .htext p { margin:2px 0 0; font-size:0.8rem; opacity:0.9; }
    main { width:100%; max-width:none; margin:0 auto; padding:24px 18px 56px; }
    .topbar { display:flex; justify-content:space-between; align-items:center; gap:14px; margin-bottom:16px; }
    .toplinks { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .back { color:var(--brand); font-weight:800; text-decoration:none; font-size:0.86rem; }
    .status { color:var(--muted); font-size:0.82rem; text-align:right; min-height:1.2em; }
    .summary { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px; margin-bottom:14px; }
    .summary-item { background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:12px; }
    .summary-label { color:var(--muted); font-size:0.72rem; font-weight:800; letter-spacing:0.08em; text-transform:uppercase; }
    .summary-value { display:block; margin-top:3px; color:var(--brand-dark); font-size:1.35rem; font-weight:900; }
    .filters { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 16px; }
    .filter { border:1px solid var(--line); border-radius:999px; background:var(--card); color:var(--brand);
      padding:8px 13px; font-size:0.82rem; font-weight:800; cursor:pointer; box-shadow:0 1px 3px rgba(60,40,90,0.05); }
    .filter.active { background:var(--brand); color:#fff; border-color:var(--brand); }
    .view-toggle { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 12px; }
    .view-button { border:1px solid var(--line); border-radius:999px; background:#fff; color:var(--brand);
      padding:8px 13px; font-size:0.82rem; font-weight:900; cursor:pointer; box-shadow:0 1px 3px rgba(60,40,90,0.05); }
    .view-button.active { background:var(--accent); color:#4a3800; border-color:#e0bd00; }
    .period-panel { background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
      box-shadow:var(--shadow); padding:12px; margin:0 0 16px; }
    .period-pager { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:10px; align-items:center; }
    .period-current { min-height:40px; display:grid; place-items:center; border-radius:999px;
      background:var(--brand); color:#fff; font-size:0.9rem; font-weight:900; text-align:center; padding:0 12px; }
    .period-arrow { display:inline-grid; place-items:center; width:40px; height:40px; border:1px solid var(--line);
      border-radius:999px; background:#fff; color:var(--brand); font-size:1.15rem; font-weight:900; cursor:pointer; }
    .period-arrow:disabled { opacity:0.42; cursor:not-allowed; }
    .cost-panel { background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
      box-shadow:var(--shadow); padding:12px; margin:18px 0 0; }
    .cost-title { margin:0 0 8px; color:var(--muted); font-size:0.72rem; font-weight:900;
      letter-spacing:0.08em; text-transform:uppercase; }
    .cost-list { display:grid; gap:10px; }
    .cost-section { display:grid; gap:10px; }
    .cost-section-title { margin:4px 0 -2px; color:var(--brand-dark); font-size:0.82rem; font-weight:900; }
    .cost-group { border:1px solid var(--line); border-radius:14px; background:#faf8fc; padding:10px; }
    .cost-group-head { display:flex; justify-content:space-between; gap:10px; align-items:baseline; color:var(--brand-dark); font-weight:900; }
    .cost-group-total { color:var(--ink); white-space:nowrap; }
    .cost-coach { margin-top:2px; color:var(--muted); font-size:0.78rem; font-weight:800; }
    .cost-detail { display:grid; gap:4px; margin-top:7px; color:var(--muted); font-size:0.8rem; font-weight:750; }
    .cost-detail-row { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:8px; align-items:center; }
    .cost-detail-rival { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .cost-chip { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line);
      border-radius:999px; background:#faf8fc; color:var(--brand-dark); padding:6px 10px; font-size:0.78rem; font-weight:850; }
    .cost-chip.total { justify-self:stretch; justify-content:flex-end; width:100%; border:0; border-radius:0;
      border-top:3px solid var(--accent); background:transparent; color:#4a3800; padding:8px 10px 0 0; }
    .monthly-panel { background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
      box-shadow:var(--shadow); padding:12px; margin:0 0 16px; }
    .monthly-title { margin:0 0 10px; color:var(--brand-dark); font-size:0.9rem; font-weight:900; }
    .monthly-load { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:8px; }
    .person-load { border:1px solid var(--line); border-radius:12px; background:#faf8fc; padding:9px 10px; }
    .person-load strong { display:block; color:var(--brand-dark); font-size:0.86rem; }
    .person-load span { display:block; margin-top:2px; color:var(--muted); font-size:0.76rem; font-weight:800; }
    .month { margin:22px 0 10px; color:var(--brand-dark); font-size:1rem; font-weight:900; }
    .games { display:grid; gap:12px; }
    .game { background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
      box-shadow:var(--shadow); padding:14px; display:grid; grid-template-columns:minmax(0,1fr) minmax(250px,330px); gap:14px; align-items:start; }
    .game.masc { border-left:5px solid #1565c0; border-right:5px solid #1565c0; background:#f2f8fe; }
    .game.fem { border-left:5px solid #c2185b; border-right:5px solid #c2185b; background:#fdf3f7; }
    .game.needs-attention { border-color:#f59e0b; background:#fff8e6; box-shadow:0 0 0 3px rgba(245,158,11,0.18), var(--shadow); }
    .game.masc.needs-attention { border-left-color:#1565c0; border-right-color:#1565c0; }
    .game.fem.needs-attention { border-left-color:#c2185b; border-right-color:#c2185b; }
    .game-main { min-width:0; }
    .meta { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:7px; color:var(--muted); font-size:0.78rem; font-weight:800; }
    .badge { border-radius:999px; background:#f3eef8; color:var(--brand-dark); padding:4px 8px; }
    .badge.sex-masc { background:#e3f2fd; color:#0d47a1; }
    .badge.sex-fem { background:#fce4ec; color:#880e4f; }
    .badge.ok { background:#e8f6ef; color:var(--ok); }
    .badge.warn { background:#fff6df; color:var(--warn); }
    .badge.review { background:#fdecec; color:var(--danger); }
    .title { display:flex; flex-wrap:wrap; gap:7px; align-items:baseline; font-weight:900; font-size:1rem; color:var(--ink); }
    .team, .rival { text-transform:uppercase; }
    .local-team { color:#2b97d5; }
    .visitor-team { color:var(--ink); }
    .loc { margin-top:6px; color:var(--muted); font-size:0.82rem; }
    .cost { margin-top:4px; color:var(--brand-dark); font-size:0.82rem; font-weight:900; }
    .assign { display:grid; gap:8px; }
    .slot { display:grid; grid-template-columns:72px 1fr; gap:8px; align-items:center; }
    .monthly-table-wrap { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow:auto; }
    .monthly-table { width:100%; border-collapse:collapse; min-width:980px; font-size:0.84rem; }
    .monthly-table th, .monthly-table td { padding:9px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle; white-space:nowrap; }
    .monthly-table th { color:var(--brand-dark); font-size:0.68rem; letter-spacing:0.06em; text-transform:uppercase; background:#faf8fc; position:sticky; top:0; z-index:1; }
    .monthly-table tr.needs-attention td { background:#fff8e6; }
    .monthly-table .assign-cell { min-width:190px; }
    .monthly-table select { min-height:36px; font-size:0.84rem; }
    label { color:var(--muted); font-size:0.74rem; font-weight:900; letter-spacing:0.06em; text-transform:uppercase; }
    select { width:100%; min-height:42px; border:1px solid var(--line); border-radius:12px; background:#fff; color:var(--ink);
      font:inherit; font-size:0.92rem; font-weight:750; padding:8px 10px; box-shadow:inset 0 1px 2px rgba(60,40,90,0.06); }
    select:focus { outline:2px solid rgba(113,63,151,0.18); border-color:var(--brand); }
    select:disabled { background:#f3f0f6; color:var(--muted); opacity:1; cursor:not-allowed; }
    .empty { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);
      padding:26px 18px; color:var(--muted); text-align:center; font-weight:750; }
    @media (max-width:720px) {
      main { padding-top:18px; }
      .topbar { align-items:flex-start; }
      .summary { grid-template-columns:repeat(3, 1fr); gap:8px; }
      .summary-item { padding:10px; }
      .summary-label { font-size:0.65rem; }
      .summary-value { font-size:1.15rem; }
      .game { grid-template-columns:1fr; gap:12px; padding:13px; }
      .slot { grid-template-columns:64px 1fr; }
    }
      .logo-link { display:inline-flex; cursor:pointer; text-decoration:none; flex-shrink:0; }
  </style>
</head>
<body>
  <header>
    <a class="logo-link" href="index.html" title="Tornar a l'inici"><img class="club-logo" src="assets/santpep-logo.png" alt="Escut CB Sant Josep de Badalona" /></a>
    <div class="htext">
      <h1><span class="club">CB Sant Josep de Badalona</span> Planificació mensual de taules</h1>
      <p>Vista mensual per repartir assignacions de taula als partits mini</p>
    </div>
    <span class="logo-mark" aria-hidden="true">🏀</span>
  </header>
  <main>
    <div class="topbar">
      <div class="toplinks">
        <a class="back" href="taules-mini.html">← Taules</a>
        <a class="back" href="index.html">Inici</a>
      </div>
      <div id="status" class="status"></div>
    </div>

    <section class="summary" aria-label="Resum de taules mini">
      <div class="summary-item"><span class="summary-label">Partits</span><span id="totalCount" class="summary-value">0</span></div>
      <div class="summary-item"><span class="summary-label">Complets</span><span id="completeCount" class="summary-value">0</span></div>
      <div class="summary-item"><span class="summary-label">Pendents</span><span id="pendingCount" class="summary-value">0</span></div>
    </section>

    <div class="filters" role="group" aria-label="Filtre d'estat">
      <button class="filter active" type="button" data-filter="all">Tots</button>
      <button class="filter" type="button" data-filter="pending">Pendents</button>
      <button class="filter" type="button" data-filter="complete">Complets</button>
      <button class="filter" type="button" data-filter="review">Revisar</button>
    </div>

    <section class="period-panel" aria-label="Paginació mensual">
      <div class="period-pager">
        <button id="prevPeriod" class="period-arrow" type="button" aria-label="Període anterior">‹</button>
        <div id="currentPeriod" class="period-current"></div>
        <button id="nextPeriod" class="period-arrow" type="button" aria-label="Període següent">›</button>
      </div>
    </section>

    <section id="content"></section>
  </main>

  <script>
    const PEOPLE = ["", "Aina Parera", "Aledis Macías", "Alex Rojas", "Clàudia Gàmiz", "Eudald Ventura", "Ferran Villarreal", "Hugo Morales", "Hugo Parvez", "Isaac Miguel", "Ivana Benito", "Jan Rodríguez", "Jana Llibre", "Joan Werner", "Joan Zanui", "Karim Garcia", "Lluc Muñoz", "Marc Sánchez", "Marc Sànchez (2012)", "Martí Ordóñez", "Martina Rubio", "Martina Rueda", "Roger Fusté", "Sílvia Muñoz", "Yago Morales"];
    const TEAM_COACHES = {
      "Cadet A M": "César Saura",
      "Cadet B M": "Gerard Castro",
      "Cadet B F": "Sergi Calatayud",
      "Cadet F": "Sergi Calatayud",
      "Infantil A M": "Mario Martín",
      "Infantil B M": "Pol Torra",
      "Infantil F": "Adrià Marí Palomo",
      "Júnior A F": "Jesús Agustín Curá",
      "Júnior A M": "Jessica Garcia",
      "Júnior B F": "Ricard Fusté",
      "Júnior B M": "Xavi Riera",
      "Mini A M": "Santi Ramírez",
      "Mini F": "Miquel Aniento",
      "Mini B M": "Pau Laviña",
      "Premini A M": "Núria Aniento",
      "Premini B M": "Dani Rojas",
      "Sènior A F": "Àlex Álvarez",
      "Sènior A M": "Oriol Ramoneda",
      "Sènior B M": "Dídac Procas"
    };
    const FIREBASE_DB_URL = "https://coord-fa09e-default-rtdb.europe-west1.firebasedatabase.app";
    const FIREBASE_PATH = "miniTablesAssignments/season-26-27";

    let games = [];
    let costGames = [];
    let assignments = {};
    let assignmentAliases = {};
    let activeFilter = "all";
    let activeView = "month";
    let periods = [];
    let activePeriodIndex = 0;

    const els = {
      status: document.getElementById("status"),
      content: document.getElementById("content"),
      total: document.getElementById("totalCount"),
      complete: document.getElementById("completeCount"),
      pending: document.getElementById("pendingCount"),
      currentPeriod: document.getElementById("currentPeriod"),
      prevPeriod: document.getElementById("prevPeriod"),
      nextPeriod: document.getElementById("nextPeriod"),
      costPanel: document.getElementById("costPanel"),
      costSummary: document.getElementById("costSummary")
    };

    function setStatus(text, tone){
      els.status.textContent = text || "";
      els.status.style.color = tone === "error" ? "var(--danger)" : "var(--muted)";
    }

    function firebaseUrl(id){
      const base = FIREBASE_DB_URL.replace(/\/$/, "");
      const path = FIREBASE_PATH.split("/").map(encodeURIComponent).join("/");
      return `${base}/${path}${id ? "/" + encodeURIComponent(id) : ""}.json`;
    }

    function normalize(value){
      return String(value || "").trim().toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    }

    function gameId(game){
      return [
        game.date, game.time, game.team, game.sex, game.rival,
        game.loc || "", game.home ? "home" : "away", game.friendly ? "friendly" : "official"
      ].map(normalize).join("_");
    }

    function stableGameKey(game){
      return [
        game.date,
        game.time,
        game.team,
        game.sex || "",
        game.rival || ""
      ].map(normalize).join("_");
    }

    function formatDate(iso){
      const [year, month, day] = String(iso).split("-");
      return `${day}/${month}/${year}`;
    }

    function formatCost(value){
      return Number(value).toLocaleString("ca-ES", { maximumFractionDigits: 2 }) + "€";
    }

    function monthLabel(iso){
      const date = new Date(`${iso}T12:00:00`);
      return date.toLocaleDateString("ca-ES", { month:"long", year:"numeric" });
    }

    function isoDate(date){
      const offsetMs = date.getTimezoneOffset() * 60000;
      return new Date(date.getTime() - offsetMs).toISOString().slice(0, 10);
    }

    function periodKey(game){
      const [year, month] = String(game.date || "").split("-");
      if (year === "2026" && month === "08") return "2026-08-31";
      const date = parseLocalDate(game.date);
      return date ? isoDate(mondayOf(date)) : String(game.date || "");
    }

    function periodLabel(key){
      const monday = parseLocalDate(key);
      if (!monday) return "Cap de setmana";
      const saturday = new Date(monday);
      saturday.setDate(saturday.getDate() + 5);
      const sunday = new Date(monday);
      sunday.setDate(sunday.getDate() + 6);
      const prefix = key === "2026-08-31" ? "Agost i " : "";
      const sameMonth = saturday.getMonth() === sunday.getMonth() && saturday.getFullYear() === sunday.getFullYear();
      const satDay = saturday.toLocaleDateString("ca-ES", { day:"numeric" });
      const sunLabel = sunday.toLocaleDateString("ca-ES", sameMonth
        ? { day:"numeric", month:"long", year:"numeric" }
        : { day:"numeric", month:"long", year:"numeric" });
      return `${prefix}Cap de setmana ${satDay}-${sunLabel}`;
    }

    function monthKey(game){
      const [year, month] = String(game.date || "").split("-");
      if (year === "2026" && (month === "08" || month === "09")) return "2026-08-09";
      return year && month ? `${year}-${month}` : String(game.date || "");
    }

    function monthPeriodLabel(key){
      if (key === "2026-08-09") return "Agost i setembre 2026";
      const [year, month] = String(key || "").split("-");
      if (!year || !month) return "Mes";
      const date = new Date(Number(year), Number(month) - 1, 1);
      return date.toLocaleDateString("ca-ES", { month:"long", year:"numeric" });
    }

    function escapeHtml(value){
      return String(value ?? "").replace(/[&<>"']/g, char => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[char]));
    }

    function costPeriodKey(game){
      const [year, month] = String(game.date || "").split("-");
      if (year === "2026" && (month === "08" || month === "09")) return "2026-08-09";
      return year && month ? `${year}-${month}` : String(game.date || "");
    }

    function activeCostPeriodKey(){
      const active = periods[activePeriodIndex];
      if (!active) return "";
      if (activeView === "month") return active.key;
      if (active.key === "2026-08-31") return "2026-08-09";
      const periodGame = [...games, ...costGames].find(game => periodKey(game) === active.key);
      return periodGame ? costPeriodKey(periodGame) : "";
    }

    function costKeyForPeriod(period){
      if (!period) return "";
      if (activeView === "month") return period.key;
      if (period.key === "2026-08-31") return "2026-08-09";
      const periodGame = [...games, ...costGames].find(game => periodKey(game) === period.key);
      return periodGame ? costPeriodKey(periodGame) : "";
    }

    function isLastCostPeriod(){
      const active = periods[activePeriodIndex];
      const activeCostKey = costKeyForPeriod(active);
      if (!active || !activeCostKey) return false;
      return !periods
        .slice(activePeriodIndex + 1)
        .some(period => costKeyForPeriod(period) === activeCostKey);
    }

    function periodSortValue(key){
      return key;
    }

    function buildPeriods(){
      const currentKey = isoDate(mondayOf(new Date()));
      periods = [...new Set([...games, ...costGames].map(periodKey).concat(currentKey))]
        .sort((a, b) => periodSortValue(a).localeCompare(periodSortValue(b)))
        .map(key => ({ key, label: periodLabel(key) }));
      activePeriodIndex = periods.findIndex(period => period.key === currentKey);
    }

    function buildMonthPeriods(){
      const current = new Date();
      const currentMonth = String(current.getMonth() + 1).padStart(2, "0");
      const currentKey = current.getFullYear() === 2026 && (currentMonth === "08" || currentMonth === "09")
        ? "2026-08-09"
        : `${current.getFullYear()}-${currentMonth}`;
      periods = [...new Set([...games, ...costGames].map(monthKey).concat(currentKey))]
        .sort((a, b) => a.localeCompare(b))
        .map(key => ({ key, label: monthPeriodLabel(key) }));
      activePeriodIndex = periods.findIndex(period => period.key === currentKey);
      if (activePeriodIndex < 0) activePeriodIndex = 0;
    }

    function rebuildPeriods(){
      if (activeView === "month") buildMonthPeriods();
      else buildPeriods();
      if (activePeriodIndex < 0) activePeriodIndex = 0;
    }

    function gameSnapshot(game){
      return {
        id: game.id,
        date: game.date,
        time: game.time,
        team: game.team,
        sex: game.sex || "",
        rival: game.rival || "",
        loc: game.loc || "",
        home: !!game.home,
        friendly: !!game.friendly,
        cost: game.cost == null ? null : game.cost
      };
    }

    function assignmentFor(id){
      return assignments[id] || assignmentAliases[id] || {};
    }

    function assignmentState(assignment){
      const one = assignment.table1 || "";
      const two = assignment.table2 || "";
      if (one && two && one === two) return "review";
      if (one && two) return "complete";
      return "pending";
    }

    function stateText(state){
      if (state === "complete") return "Completa";
      if (state === "review") return "Revisar";
      return "Pendent";
    }

    function isClubVenue(game){
      const loc = normalize(game.loc || "");
      return game.home || loc.includes("la-colina") || loc.includes("montigala") || loc.includes("bufala") || loc.includes("pomar");
    }

    function todayIso(){
      const now = new Date();
      const offsetMs = now.getTimezoneOffset() * 60000;
      return new Date(now.getTime() - offsetMs).toISOString().slice(0, 10);
    }

    function parseLocalDate(iso){
      const [year, month, day] = String(iso || "").split("-").map(Number);
      if (!year || !month || !day) return null;
      return new Date(year, month - 1, day);
    }

    function mondayOf(date){
      const result = new Date(date);
      const day = (result.getDay() + 6) % 7;
      result.setHours(0, 0, 0, 0);
      result.setDate(result.getDate() - day);
      return result;
    }

    function isCurrentWeekGame(game){
      const gameDate = parseLocalDate(game.date);
      if (!gameDate) return false;
      return mondayOf(gameDate).getTime() === mondayOf(new Date()).getTime();
    }

    function isPastGame(game){
      return String(game.date || "") < todayIso();
    }

    async function loadGames(){
      const response = await fetch("partits.html", { cache:"no-store" });
      if (!response.ok) throw new Error("No s'ha pogut carregar partits.html");
      const html = await response.text();
      const doc = new DOMParser().parseFromString(html, "text/html");
      const raw = doc.getElementById("partitsData");
      if (!raw) throw new Error("No s'han trobat les dades de partits");
      const data = JSON.parse(raw.textContent);
      const importedGames = data.weeks.flatMap(week => week.games || [])
        .map(game => ({ ...game, id: gameId(game) }));
      games = importedGames
        .filter(game => isClubVenue(game) && (game.fam === "MINI" || game.fam === "PREMINI" || game.friendly))
        .sort((a, b) => `${a.date} ${a.time}`.localeCompare(`${b.date} ${b.time}`));
      costGames = importedGames
        .filter(game => game.friendly && game.cost != null)
        .sort((a, b) => `${a.date} ${a.time}`.localeCompare(`${b.date} ${b.time}`));
    }

    async function loadAssignments(){
      const response = await fetch(firebaseUrl(), { cache:"no-store" });
      if (!response.ok) throw new Error("No s'han pogut carregar les assignacions");
      assignments = await response.json() || {};
      assignmentAliases = {};
      const savedByStableKey = {};
      Object.entries(assignments).forEach(([id, assignment]) => {
        if (assignment && assignment.game) savedByStableKey[stableGameKey(assignment.game)] = assignment;
      });
      games.forEach(game => {
        if (!assignments[game.id]) {
          const legacy = savedByStableKey[stableGameKey(game)];
          if (legacy) assignmentAliases[game.id] = legacy;
        }
      });
    }

    async function saveAssignment(id){
      const game = games.find(item => item.id === id);
      const assignment = assignmentFor(id);
      const body = {
        ...assignment,
        game: game ? gameSnapshot(game) : null,
        updatedAt: new Date().toISOString()
      };
      const hasPeople = !!(body.table1 || body.table2);
      const response = await fetch(firebaseUrl(id), {
        method: hasPeople ? "PUT" : "DELETE",
        headers: hasPeople ? { "Content-Type":"application/json" } : undefined,
        body: hasPeople ? JSON.stringify(body) : undefined
      });
      if (!response.ok) throw new Error("No s'ha pogut guardar l'assignació");
      if (!hasPeople) delete assignments[id];
    }

    function makeSelect(game, slot, value){
      const select = document.createElement("select");
      select.dataset.gameId = game.id;
      select.dataset.slot = slot;
      select.disabled = isPastGame(game);
      if (select.disabled) select.title = "Aquest partit ja s'ha jugat i no es pot modificar.";
      PEOPLE.forEach(person => {
        const option = document.createElement("option");
        option.value = person;
        option.textContent = person || "Pendent";
        option.selected = person === value;
        select.appendChild(option);
      });
      if (value && !PEOPLE.includes(value)) {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = `${value} (històric)`;
        option.selected = true;
        select.appendChild(option);
      }
      return select;
    }

    function renderSummary(){
      const periodGames = gamesForActivePeriod();
      const states = periodGames.map(game => assignmentState(assignmentFor(game.id)));
      els.total.textContent = periodGames.length;
      els.complete.textContent = states.filter(state => state === "complete").length;
      els.pending.textContent = states.filter(state => state !== "complete").length;
    }

    function gamesForActivePeriod(){
      const active = periods[activePeriodIndex];
      if (!active) return [];
      return games.filter(game => activeView === "month" ? monthKey(game) === active.key : periodKey(game) === active.key);
    }

    function filteredGames(){
      return gamesForActivePeriod().filter(game => {
        const state = assignmentState(assignmentFor(game.id));
        return activeFilter === "all" || state === activeFilter;
      });
    }

    function renderPeriodControls(){
      const active = periods[activePeriodIndex];
      els.currentPeriod.textContent = active ? active.label : "Sense partits";
      els.prevPeriod.disabled = activePeriodIndex <= 0;
      els.nextPeriod.disabled = activePeriodIndex >= periods.length - 1;
    }

    function personLoadForGames(periodGames){
      const load = new Map();
      periodGames.forEach(game => {
        const assignment = assignmentFor(game.id);
        ["table1", "table2"].forEach(slot => {
          const person = assignment[slot];
          if (!person) return;
          const current = load.get(person) || { name: person, total: 0 };
          current.total += 1;
          load.set(person, current);
        });
      });
      return [...load.values()].sort((a, b) => b.total - a.total || a.name.localeCompare(b.name, "ca"));
    }

    function renderMonthlyLoad(periodGames){
      const panel = document.createElement("section");
      panel.className = "monthly-panel";
      const title = document.createElement("h2");
      title.className = "monthly-title";
      title.textContent = "Resum mensual per persona";
      const grid = document.createElement("div");
      grid.className = "monthly-load";
      const loads = personLoadForGames(periodGames);
      if (!loads.length) {
        grid.appendChild(Object.assign(document.createElement("div"), { className:"empty", textContent:"Encara no hi ha cap assignació en aquest mes." }));
      } else {
        loads.forEach(item => {
          const card = document.createElement("div");
          card.className = "person-load";
          card.innerHTML = `<strong>${escapeHtml(item.name)}</strong><span>${item.total} assignacions</span>`;
          grid.appendChild(card);
        });
      }
      panel.append(title, grid);
      els.content.appendChild(panel);
    }

    function renderCosts(){
      const costKey = activeCostPeriodKey();
      const showMonthlyCosts = isLastCostPeriod();
      const monthlyCostGames = showMonthlyCosts && costKey ? costGames.filter(game => costPeriodKey(game) === costKey) : [];
      const period = periods[activePeriodIndex];
      const weeklyCostGames = period ? costGames.filter(game => periodKey(game) === period.key) : [];
      els.costSummary.innerHTML = "";
      if (!monthlyCostGames.length && !weeklyCostGames.length) {
        els.costPanel.hidden = true;
        return;
      }

      els.costPanel.hidden = false;
      if (showMonthlyCosts) appendCostSection("Mes", monthlyCostGames);
      appendCostSection("Setmana", weeklyCostGames);
    }

    function appendCostSection(title, visibleCostGames){
      if (!visibleCostGames.length) return;

      const section = document.createElement("div");
      section.className = "cost-section";
      const sectionTitle = document.createElement("h3");
      sectionTitle.className = "cost-section-title";
      sectionTitle.textContent = title;
      section.appendChild(sectionTitle);

      const teamCosts = new Map();
      visibleCostGames.forEach(game => {
        const key = `${game.team} ${game.sex}`;
        const current = teamCosts.get(key) || { label: key, total: 0, games: [] };
        current.total += Number(game.cost) || 0;
        current.games.push(game);
        teamCosts.set(key, current);
      });
      let total = 0;
      [...teamCosts.values()]
        .sort((a, b) => a.label.localeCompare(b.label, "ca-ES"))
        .forEach(teamCost => {
          total += teamCost.total;
          const group = document.createElement("div");
          group.className = "cost-group";
          const head = document.createElement("div");
          head.className = "cost-group-head";
          const gamesLabel = teamCost.games.length === 1 ? "1 partit" : `${teamCost.games.length} partits`;
          head.append(
            Object.assign(document.createElement("span"), { textContent: `${teamCost.label} · ${gamesLabel}` }),
            Object.assign(document.createElement("span"), { className:"cost-group-total", textContent: formatCost(teamCost.total) })
          );
          const coach = document.createElement("div");
          coach.className = "cost-coach";
          coach.textContent = `Coach: ${TEAM_COACHES[teamCost.label] || "Pendent"}`;
          const detail = document.createElement("div");
          detail.className = "cost-detail";
          teamCost.games
            .sort((a, b) => `${a.date} ${a.time}`.localeCompare(`${b.date} ${b.time}`))
            .forEach(game => {
              const row = document.createElement("div");
              row.className = "cost-detail-row";
              row.append(
                Object.assign(document.createElement("span"), { textContent: formatDate(game.date) }),
                Object.assign(document.createElement("span"), { className:"cost-detail-rival", textContent: game.rival || "Rival pendent" }),
                Object.assign(document.createElement("span"), { textContent: formatCost(game.cost) })
              );
              detail.appendChild(row);
            });
          group.append(head, coach, detail);
          section.appendChild(group);
        });
      const totalChip = document.createElement("span");
      totalChip.className = "cost-chip total";
      totalChip.textContent = `Total: ${formatCost(total)}`;
      section.appendChild(totalChip);
      els.costSummary.appendChild(section);
    }

    function render(){
      renderPeriodControls();
      renderSummary();
      const visible = filteredGames();

      els.content.innerHTML = "";
      if (!visible.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = games.length ? "No hi ha partits amb aquest filtre en aquest període." : "Encara no hi ha partits MINI ni amistosos importats.";
        els.content.appendChild(empty);
        return;
      }

      if (activeView === "month") {
        renderMonthlyTable(visible);
        renderMonthlyLoad(gamesForActivePeriod());
        return;
      }

      let currentMonth = "";
      let list = null;
      visible.forEach(game => {
        const month = monthLabel(game.date);
        if (month !== currentMonth) {
          currentMonth = month;
          const title = document.createElement("h2");
          title.className = "month";
          title.textContent = month.charAt(0).toUpperCase() + month.slice(1);
          els.content.appendChild(title);
          list = document.createElement("div");
          list.className = "games";
          els.content.appendChild(list);
        }

        const assignment = assignmentFor(game.id);
        const state = assignmentState(assignment);
        const card = document.createElement("article");
        card.className = `game ${game.sex === "F" ? "fem" : "masc"}`;
        if (state !== "complete" && isCurrentWeekGame(game)) card.classList.add("needs-attention");

        const main = document.createElement("div");
        main.className = "game-main";
        const meta = document.createElement("div");
        meta.className = "meta";
        const stateBadge = document.createElement("span");
        stateBadge.className = `badge ${state === "complete" ? "ok" : state === "review" ? "review" : "warn"}`;
        stateBadge.textContent = stateText(state);
        meta.append(
          Object.assign(document.createElement("span"), { className:"badge", textContent:`${formatDate(game.date)} · ${game.time || "Hora pendent"}` }),
          Object.assign(document.createElement("span"), { className:`badge ${game.sex === "F" ? "sex-fem" : "sex-masc"}`, textContent:game.sex === "F" ? "Femení" : "Masculí" }),
          Object.assign(document.createElement("span"), { className:"badge", textContent:game.fam === "MINI" ? "Mini" : game.fam === "PREMINI" ? "Premini" : "Amistós" }),
          stateBadge
        );

        const title = document.createElement("div");
        title.className = "title";
        const team = document.createElement("span");
        team.className = `team ${game.home ? "local-team" : "visitor-team"}`;
        team.textContent = game.team || "Equip";
        const versus = document.createElement("span");
        versus.textContent = "vs";
        const rival = document.createElement("span");
        rival.className = `rival ${game.home ? "visitor-team" : "local-team"}`;
        rival.textContent = game.rival || "Rival pendent";
        title.append(team, versus, rival);
        const loc = document.createElement("div");
        loc.className = "loc";
        loc.textContent = game.loc || "Localització pendent";
        main.append(meta, title, loc);
        if (game.cost != null) {
          const cost = document.createElement("div");
          cost.className = "cost";
          cost.textContent = `Cost: ${formatCost(game.cost)}`;
          main.appendChild(cost);
        }

        const assign = document.createElement("div");
        assign.className = "assign";
        ["table1", "table2"].forEach((slot, idx) => {
          const row = document.createElement("div");
          row.className = "slot";
          const label = document.createElement("label");
          label.textContent = `Taula ${idx + 1}`;
          row.append(label, makeSelect(game, slot, assignment[slot] || ""));
          assign.appendChild(row);
        });
        card.append(main, assign);
        list.appendChild(card);
      });
    }

    function renderMonthlyTable(visible){
      const wrap = document.createElement("div");
      wrap.className = "monthly-table-wrap";
      const table = document.createElement("table");
      table.className = "monthly-table";
      table.innerHTML = "<thead><tr><th>Data</th><th>Hora</th><th>Equip</th><th>Rival</th><th>Lloc</th><th>Estat</th><th>Taula 1</th><th>Taula 2</th></tr></thead><tbody></tbody>";
      const body = table.querySelector("tbody");
      visible.forEach(game => {
        const assignment = assignmentFor(game.id);
        const state = assignmentState(assignment);
        const row = document.createElement("tr");
        if (state !== "complete" && !isPastGame(game)) row.classList.add("needs-attention");
        const stateBadge = `<span class="badge ${state === "complete" ? "ok" : state === "review" ? "review" : "warn"}">${escapeHtml(stateText(state))}</span>`;
        row.innerHTML =
          `<td>${escapeHtml(formatDate(game.date))}</td>` +
          `<td>${escapeHtml(game.time || "Hora pendent")}</td>` +
          `<td><span class="badge ${game.sex === "F" ? "sex-fem" : "sex-masc"}">${escapeHtml(`${game.team} ${game.sex || ""}`)}</span></td>` +
          `<td>${escapeHtml(game.rival || "Rival pendent")}</td>` +
          `<td>${escapeHtml(game.loc || "Localització pendent")}</td>` +
          `<td>${stateBadge}</td>` +
          `<td class="assign-cell"></td>` +
          `<td class="assign-cell"></td>`;
        row.children[6].appendChild(makeSelect(game, "table1", assignment.table1 || ""));
        row.children[7].appendChild(makeSelect(game, "table2", assignment.table2 || ""));
        body.appendChild(row);
      });
      wrap.appendChild(table);
      els.content.appendChild(wrap);
    }

    document.querySelectorAll(".filter").forEach(button => {
      button.addEventListener("click", () => {
        activeFilter = button.dataset.filter;
        document.querySelectorAll(".filter").forEach(item => item.classList.toggle("active", item === button));
        render();
      });
    });

    document.querySelectorAll(".view-button").forEach(button => {
      button.addEventListener("click", () => {
        activeView = button.dataset.view;
        document.querySelectorAll(".view-button").forEach(item => item.classList.toggle("active", item === button));
        rebuildPeriods();
        render();
      });
    });

    els.prevPeriod.addEventListener("click", () => {
      if (activePeriodIndex <= 0) return;
      activePeriodIndex -= 1;
      render();
    });

    els.nextPeriod.addEventListener("click", () => {
      if (activePeriodIndex >= periods.length - 1) return;
      activePeriodIndex += 1;
      render();
    });

    els.content.addEventListener("change", async event => {
      if (event.target.tagName !== "SELECT") return;
      const id = event.target.dataset.gameId;
      const slot = event.target.dataset.slot;
      assignments[id] = { ...assignmentFor(id), [slot]: event.target.value };
      render();
      setStatus("Guardant...");
      try {
        await saveAssignment(id);
        render();
        setStatus("Assignació guardada.");
      } catch (error) {
        console.error(error);
        setStatus(error.message, "error");
      }
    });

    (async function init(){
      setStatus("Carregant...");
      try {
        await loadGames();
        rebuildPeriods();
        try {
          await loadAssignments();
        } catch (error) {
          console.warn(error);
          assignments = {};
          setStatus("Firebase no deixa carregar assignacions.", "error");
        }
        render();
        if (els.status.textContent === "Carregant...") setStatus("");
      } catch (error) {
        console.error(error);
        setStatus(error.message, "error");
        els.content.innerHTML = '<div class="empty">No s\'han pogut carregar les taules.</div>';
      }
    })();
  </script>
</body>
</html>
